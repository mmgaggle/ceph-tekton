# vuln-scan-smoke-test — smoke pipeline for the `vuln-scan` Task.
#
# Wires `vuln-scan` against the cheapest possible vulnerable input
# that still proves the Task end-to-end:
#
#   - A `vuln-scan-smoke-seed` Task writes a deterministic synthetic
#     CycloneDX-JSON SBOM into the shared `sboms` workspace. The
#     SBOM declares a single deliberately-vulnerable component
#     (`log4j-core` at 2.14.1 — Log4Shell, CVE-2021-44228 +
#     CVE-2021-45046 + others, ranked Critical by Grype). This
#     avoids depending on `generate-sbom` and lets the smoke run
#     fast: no syft, no real package payload, no .tar files to scan.
#
#   - `vuln-scan` fetches the producer-published Grype DB from the
#     URL passed in via `db-pointer-url` (default points at the prod
#     artifacts.ceph.com canonical URL; smoke runs against vstart
#     override this to a dev RGW HTTPS endpoint), cosign-verifies
#     it, unpacks it, runs grype against the seeded SBOM with
#     `fail-on-severity=""` (non-gating), and emits the
#     Chains-grammar Results.
#
#   - `vuln-scan-smoke-assert` greps every Result for shape
#     conformance:
#       * `vuln-summary` includes the expected `critical=` /
#         `high=` / `medium=` tokens, with the critical+high tally
#         > 0 (Log4Shell is Critical; the chain of dependent CVEs
#         pulls in High as well).
#       * `findings-ARTIFACT_OUTPUTS` is a JSON object with the
#         expected three keys (uri, digest, isBuildArtifact) — the
#         exact wire format Chains' object-Result matcher consumes.
#       * `findings-count` is a positive integer.
#       * The consolidated `findings.grype.json` in the sboms
#         workspace parses as JSON (lightweight shape check; the
#         smoke runs offline so no jq, only busybox grep).
#
# Why a synthetic SBOM instead of `generate-sbom -> vuln-scan`:
#   Composing the two Tasks IS the production wiring (see
#   docs/vuln-scanning.md "Wiring into a real build pipeline"), but
#   it means the smoke run depends on syft + a fake package payload
#   + the generate-sbom Task being deployed — every dependency adds
#   a way for the smoke to false-negative on a `vuln-scan` bug. A
#   hand-crafted SBOM with a known-vulnerable component is the
#   minimal input that proves the fetch + verify + unpack + scan +
#   emit path.
#
# DB DELIVERY MODEL:
#   The new vuln-scan Task fetches the Grype DB OUT OF BAND from
#   the producer Pipeline (`pipelines/build-grype-db.yaml` + Task
#   `tasks/build-grype-db`). There is no `db-update` step inside
#   the consumer Task — that step was the runtime-bug source in the
#   original #51 draft (distroless grype + TUI assumptions + per-
#   step /tmp not shared between db-update and scan). The smoke
#   pipeline therefore has NO `db-cache` workspace; the consumer
#   Task fetches a fresh DB tarball into its own `.grype-db/`
#   subdirectory of the sboms workspace per TaskRun.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: vuln-scan-smoke-seed
spec:
  description: |
    Stage one deterministic synthetic CycloneDX-JSON SBOM into the
    shared sboms workspace, declaring a single component that Grype
    knows has Critical CVEs (log4j-core 2.14.1 — Log4Shell).

    The SBOM bytes are written verbatim from a heredoc so the smoke
    test is byte-stable across runs and doesn't depend on syft or
    any other SBOM generator.
  params:
    - name: tools-image
      type: string
      default: docker.io/library/busybox:1.36
      description: |
        Pinned busybox image. Same pin as the other smoke tests in
        this repo for build determinism.
  workspaces:
    - name: sboms
      mountPath: /workspace/sboms
  steps:
    - name: seed
      image: $(params.tools-image)
      workingDir: /workspace/sboms
      script: |
        #!/bin/sh
        set -eu

        # CycloneDX 1.5 JSON for a single vulnerable component.
        # `purl` is the key field Grype matches against the
        # vulnerability DB; the human-readable name+version is a
        # convenience for log inspection.
        #
        # Log4Shell (CVE-2021-44228) on log4j-core 2.14.1 is one of
        # the most stably-indexed CVEs across grype's DB releases —
        # if a future grype version stops finding this we have
        # bigger problems than the smoke test.
        cat > log4j-shell.cdx.json <<'EOF'
        {
          "bomFormat": "CycloneDX",
          "specVersion": "1.5",
          "serialNumber": "urn:uuid:00000000-0000-4000-8000-000000000001",
          "version": 1,
          "metadata": {
            "timestamp": "2023-11-14T22:13:20Z",
            "tools": {
              "components": [
                {
                  "type": "application",
                  "name": "vuln-scan-smoke-seed",
                  "version": "1.0.0"
                }
              ]
            },
            "component": {
              "bom-ref": "pkg:generic/vuln-scan-smoke@1.0.0",
              "type": "application",
              "name": "vuln-scan-smoke",
              "version": "1.0.0"
            }
          },
          "components": [
            {
              "bom-ref": "pkg:maven/org.apache.logging.log4j/log4j-core@2.14.1",
              "type": "library",
              "group": "org.apache.logging.log4j",
              "name": "log4j-core",
              "version": "2.14.1",
              "purl": "pkg:maven/org.apache.logging.log4j/log4j-core@2.14.1"
            }
          ]
        }
        EOF

        echo "[seed] staged SBOMs:"
        ls -la /workspace/sboms
        echo
        echo "[seed] log4j-shell.cdx.json head:"
        head -c 200 log4j-shell.cdx.json
        echo
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: vuln-scan-smoke-assert
spec:
  description: |
    Assert that `vuln-scan` emitted the expected Chains-grammar
    Results and that the consolidated findings file is shape-valid.

    We wire the upstream Results in as Pipeline params and grep
    them in-pod, so this Task needs no cluster RBAC against
    TaskRuns and runs on any dev SA. Same pattern as
    sbom-pkg-smoke-assert in pipelines/sbom-pkg-smoke-test.yaml.
  params:
    - name: findings-uri
      type: string
      description: |
        `.uri` of the upstream `findings-ARTIFACT_OUTPUTS` object
        Result. Tekton object-Result references use per-key syntax
        `$(tasks.<t>.results.<r>.<key>)`; the assert step
        re-composes a sanity check from the three keys.
    - name: findings-digest
      type: string
      description: |
        `.digest` of the upstream `findings-ARTIFACT_OUTPUTS` object
        Result. sha256:<hex>.
    - name: findings-is-build-artifact
      type: string
      description: |
        `.isBuildArtifact` of the upstream `findings-ARTIFACT_OUTPUTS`
        object Result. MUST be the string "false" (Chains uses this
        to classify the entry as a byproduct, not a subject).
    - name: vuln-summary
      type: string
      description: |
        Upstream `vuln-summary` Result. Shape:
        `critical=N high=N medium=N low=N negligible=N unknown=N`.
    - name: findings-count
      type: string
      description: |
        Upstream `findings-count` Result. Total grype matches across
        all scanned SBOMs.
    - name: tools-image
      type: string
      default: docker.io/library/busybox:1.36
  workspaces:
    - name: sboms
      description: |
        Shared sboms workspace, re-bound here so we can sanity-check
        that the consolidated findings file actually landed where
        the URI Result claims.
      mountPath: /workspace/sboms
  steps:
    - name: assert
      image: $(params.tools-image)
      env:
        - name: FINDINGS_URI
          value: $(params.findings-uri)
        - name: FINDINGS_DIGEST
          value: $(params.findings-digest)
        - name: FINDINGS_IS_BUILD_ARTIFACT
          value: $(params.findings-is-build-artifact)
        - name: VULN_SUMMARY
          value: $(params.vuln-summary)
        - name: FINDINGS_COUNT
          value: $(params.findings-count)
      script: |
        #!/bin/sh
        set -eu
        FAIL=0

        echo "[assert] vuln-summary='${VULN_SUMMARY}'"
        echo "[assert] findings-count='${FINDINGS_COUNT}'"
        echo "[assert] findings-ARTIFACT_OUTPUTS.uri='${FINDINGS_URI}'"
        echo "[assert] findings-ARTIFACT_OUTPUTS.digest='${FINDINGS_DIGEST}'"
        echo "[assert] findings-ARTIFACT_OUTPUTS.isBuildArtifact='${FINDINGS_IS_BUILD_ARTIFACT}'"
        echo

        # ---- vuln-summary shape ----
        for token in critical= high= medium= low= negligible= unknown=; do
          if ! printf '%s' "${VULN_SUMMARY}" | grep -q "${token}"; then
            echo "[assert] FAIL: vuln-summary missing '${token}' token" >&2
            FAIL=1
          fi
        done

        # ---- Critical findings present (Log4Shell on log4j-core 2.14.1) ----
        # The shape is `critical=N high=N ...`, so we split on spaces
        # and grep the critical token.
        CRIT=$(printf '%s\n' "${VULN_SUMMARY}" \
          | tr ' ' '\n' \
          | grep '^critical=' \
          | head -n1 \
          | sed 's/^critical=//')
        CRIT=${CRIT:-0}
        echo "[assert] critical count: ${CRIT}"
        if [ "${CRIT}" -lt 1 ]; then
          echo "[assert] FAIL: expected at-least 1 critical finding (log4j-core 2.14.1 / CVE-2021-44228); got ${CRIT}" >&2
          echo "[assert] NOTE: grype's vulnerability DB updates over time. If this becomes a false negative," >&2
          echo "[assert]       check that the seed SBOM still references a CVE-bearing version." >&2
          FAIL=1
        fi

        # ---- findings-count is a positive integer ----
        case "${FINDINGS_COUNT}" in
          ''|*[!0-9]*)
            echo "[assert] FAIL: findings-count='${FINDINGS_COUNT}' is not a non-negative integer" >&2
            FAIL=1
            ;;
          *)
            if [ "${FINDINGS_COUNT}" -lt 1 ]; then
              echo "[assert] FAIL: findings-count=${FINDINGS_COUNT}; expected > 0 for log4j-core 2.14.1" >&2
              FAIL=1
            fi
            ;;
        esac

        # ---- findings-ARTIFACT_OUTPUTS keys ----
        # uri must be non-empty and end in .grype.json
        if [ -z "${FINDINGS_URI}" ]; then
          echo "[assert] FAIL: findings-ARTIFACT_OUTPUTS.uri is empty" >&2
          FAIL=1
        elif ! printf '%s' "${FINDINGS_URI}" | grep -q '\.grype\.json$'; then
          echo "[assert] FAIL: findings-ARTIFACT_OUTPUTS.uri must end in .grype.json (got '${FINDINGS_URI}')" >&2
          FAIL=1
        fi
        # digest must be sha256:<64-hex>
        if ! printf '%s' "${FINDINGS_DIGEST}" | grep -qE '^sha256:[0-9a-f]{64}$'; then
          echo "[assert] FAIL: findings-ARTIFACT_OUTPUTS.digest must be sha256:<64-hex> (got '${FINDINGS_DIGEST}')" >&2
          FAIL=1
        fi
        # isBuildArtifact MUST be "false" — Chains uses this to
        # classify the entry as a byproduct, not a subject.
        if [ "${FINDINGS_IS_BUILD_ARTIFACT}" != "false" ]; then
          echo "[assert] FAIL: findings-ARTIFACT_OUTPUTS.isBuildArtifact must be 'false' (got '${FINDINGS_IS_BUILD_ARTIFACT}')" >&2
          FAIL=1
        fi

        # ---- Consolidated findings JSON exists + parses (loosely) ----
        AGG="/workspace/sboms/findings.grype.json"
        if [ ! -f "${AGG}" ]; then
          echo "[assert] FAIL: ${AGG} not present" >&2
          FAIL=1
        else
          BYTES=$(wc -c < "${AGG}")
          echo "[assert] ${AGG} size: ${BYTES} bytes"
          if [ "${BYTES}" -lt 16 ]; then
            echo "[assert] FAIL: ${AGG} suspiciously tiny" >&2
            FAIL=1
          fi
          # Top-level shape: {"scans":[...],"summary":{...}}
          for k in '"scans"' '"summary"' '"critical"' '"total"'; do
            if ! grep -q "${k}" "${AGG}"; then
              echo "[assert] FAIL: ${AGG} missing key ${k}" >&2
              FAIL=1
            fi
          done
          # The findings digest the Task surfaced should match the
          # actual file content on disk.
          ACTUAL="sha256:$(sha256sum "${AGG}" | awk '{print $1}')"
          if [ "${ACTUAL}" != "${FINDINGS_DIGEST}" ]; then
            echo "[assert] FAIL: findings.grype.json on-disk digest (${ACTUAL}) != Result digest (${FINDINGS_DIGEST})" >&2
            FAIL=1
          else
            echo "[assert] OK: findings.grype.json on-disk digest matches Result digest"
          fi
        fi

        if [ "${FAIL}" -ne 0 ]; then
          echo "[assert] one or more assertions failed" >&2
          exit 1
        fi
        echo "[assert] all Chains-grammar Results present and well-formed"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: vuln-scan-smoke-test
spec:
  description: |
    Three-Task pipeline:
      1. `seed`              — stage one deterministic synthetic
                               CycloneDX SBOM declaring log4j-core
                               2.14.1 (Log4Shell, CVE-2021-44228 et
                               al.) into the sboms workspace.
      2. `vuln-scan`         — fetch the producer-published Grype DB
                               from `db-pointer-url`, cosign-verify
                               it, unpack, scan the seeded SBOM with
                               `fail-on-severity=""` so the smoke is
                               non-gating. Emits the Chains-grammar
                               Results.
      3. `assert-results`    — verify each Result is shape-correct
                               (critical findings > 0,
                               findings-ARTIFACT_OUTPUTS carries
                               the uri/digest/isBuildArtifact triple
                               with isBuildArtifact:"false", the
                               consolidated findings JSON exists
                               and parses). Fails the PipelineRun
                               on any mismatch.

    See docs/vuln-scanning.md for the verifier-side walkthrough
    (how to extract the findings JSON from the Chains attestation
    and re-parse with grype / jq) and for the producer/consumer
    contract this pipeline exercises end-to-end.
  params:
    - name: grype-image
      type: string
      default: docker.io/anchore/grype:v0.112.0
    - name: cosign-image
      type: string
      default: ghcr.io/sigstore/cosign/cosign:v2.4.1
    - name: tools-image
      type: string
      default: docker.io/library/busybox:1.36
    - name: sbom-file
      type: string
      default: "log4j-shell.cdx.json"
      description: |
        Single CycloneDX SBOM file (relative to the sboms workspace)
        for the vuln-scan Task to scan. Smoke seed writes this name
        by default; real pipelines bind the build-output workspace
        `generate-sbom` writes to and fan out per-artifact via
        Pipeline-level `matrix:` (see docs/vuln-scanning.md).
    - name: fail-on-severity
      type: string
      default: ""
      description: |
        Threshold for gating. Default empty = non-gating (matches
        the #51 issue body's default). The smoke pipeline leaves
        this empty so the Log4Shell finding does NOT fail the run —
        the gating behaviour is exercised via the assert step's
        per-severity counts check rather than by letting the gate
        fire.
    - name: db-pointer-url
      type: string
      default: "https://artifacts.ceph.com/ceph-grype-db/grype-db/6/latest.json"
      description: |
        Canonical HTTPS URL of the producer's `latest.json` pointer.
        Default points at the production prefix on artifacts.ceph.com
        so the smoke pipeline works against a real cluster with no
        per-environment overrides. Smoke runs against vstart override
        this to a dev RGW HTTPS endpoint (e.g.
        `http://localhost:18000/vstart-ceph-grype-db/grype-db/6/latest.json`
        when the prototype script has just run end-to-end). The
        producer Pipeline `pipelines/build-grype-db.yaml` writes the
        pointer + sibling artefacts.
  workspaces:
    - name: sboms
      description: |
        Shared workspace where the seed Task drops the SBOM and the
        vuln-scan Task writes per-scan output + consolidated
        `findings.grype.json`. emptyDir is fine for smoke; real
        pipelines bind the build-output PVC from `generate-sbom`.

        The vuln-scan Task also fetches the producer DB tarball +
        bundle + pubkey into a `.grype-db/` subdirectory of this
        workspace — no separate db-cache workspace is needed (the
        new producer/consumer model fetches fresh per TaskRun).
  tasks:
    - name: seed
      taskRef:
        name: vuln-scan-smoke-seed
      params:
        - name: tools-image
          value: $(params.tools-image)
      workspaces:
        - name: sboms
          workspace: sboms
    - name: vuln-scan
      runAfter: [seed]
      taskRef:
        name: vuln-scan
      params:
        - name: sbom-file
          value: $(params.sbom-file)
        - name: db-pointer-url
          value: $(params.db-pointer-url)
        - name: grype-image
          value: $(params.grype-image)
        - name: cosign-image
          value: $(params.cosign-image)
        - name: tools-image
          value: $(params.tools-image)
        - name: fail-on-severity
          value: $(params.fail-on-severity)
      workspaces:
        - name: sboms
          workspace: sboms
    - name: assert-results
      runAfter: [vuln-scan]
      taskRef:
        name: vuln-scan-smoke-assert
      params:
        # Per-key object Result references — Tekton's documented
        # syntax for object Results.
        - name: findings-uri
          value: $(tasks.vuln-scan.results.findings-ARTIFACT_OUTPUTS.uri)
        - name: findings-digest
          value: $(tasks.vuln-scan.results.findings-ARTIFACT_OUTPUTS.digest)
        - name: findings-is-build-artifact
          value: $(tasks.vuln-scan.results.findings-ARTIFACT_OUTPUTS.isBuildArtifact)
        - name: vuln-summary
          value: $(tasks.vuln-scan.results.vuln-summary)
        - name: findings-count
          value: $(tasks.vuln-scan.results.findings-count)
        - name: tools-image
          value: $(params.tools-image)
      workspaces:
        - name: sboms
          workspace: sboms
  results:
    # Re-expose the vuln-scan Task's Results at the Pipeline level
    # so a PipelineRun-level Chains attestation (deep-inspection on
    # or off) sees the same byproduct grammar that the TaskRun
    # exposes. vuln-summary + findings-count are contract-level
    # convenience surfaces for dashboards and the smoke assert.
    #
    # `findings-ARTIFACT_OUTPUTS` itself is the Chains-grammar
    # object Result. With Chains 0.26's
    # `artifacts.pipelinerun.enable-deep-inspection: "true"` ConfigMap
    # flag (set by the chains-smoke-test setup the rest of the repo
    # depends on), Chains walks child TaskRun Results and rolls them
    # up into the PipelineRun-level attestation — so re-exposing the
    # OBJECT at the Pipeline level is unnecessary for the
    # attestation. We do re-expose the scalar Results so PaC GitHub
    # Checks / the ceph-builds-api shim can read them without
    # following the child-TaskRun pointer.
    - name: vuln-summary
      description: |
        Per-severity tally: `critical=N high=N medium=N low=N
        negligible=N unknown=N`.
      value: $(tasks.vuln-scan.results.vuln-summary)
    - name: findings-count
      description: Total grype matches across all scanned SBOMs.
      value: $(tasks.vuln-scan.results.findings-count)

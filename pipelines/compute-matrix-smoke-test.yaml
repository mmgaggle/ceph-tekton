# compute-matrix-smoke-test — smoke pipeline for the `compute-matrix` Task.
#
# Wires `compute-matrix` against the cheapest possible synthetic input
# that still proves the Task end-to-end:
#
#   - A `compute-matrix-smoke-seed` Task writes a deterministic synthetic
#     matrix.yaml into the shared `source` workspace. The matrix covers
#     three cells with a mix of gating=true / gating=false, so the
#     downstream assert has signal on both code paths. Hand-rolled bytes
#     follow the same pattern as `vuln-scan-smoke-seed` — no upstream
#     git-clone Task is needed (real pipelines wire one upstream; that's
#     their concern, not the smoke's).
#
#   - `compute-matrix` parses the seeded matrix.yaml and emits the
#     `matrix`, `cell-count`, `gating-count` Results.
#
#   - `compute-matrix-smoke-assert` consumes all three Results and
#     re-validates the JSON array shape from inside the cluster:
#       * `matrix` parses as a JSON array.
#       * Every entry has distro / arch / gating keys.
#       * `cell-count` is a positive integer and equals len(matrix).
#       * `gating-count <= cell-count`.
#       * For the synthetic seed specifically, cell-count == 3 and
#         gating-count == 2 (two true + one false).
#
# Why a synthetic matrix instead of cloning ceph/ceph:
#   The smoke MUST run offline in CI (no internet at the kind nodes by
#   default, and even when there is, we don't want the smoke to depend
#   on the live state of ceph/ceph's main branch). A hand-crafted
#   matrix.yaml with a known cell count is the minimal input that proves
#   the parse + JSON-emit + sanity-check path end-to-end.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: compute-matrix-smoke-seed
spec:
  description: |
    Stage a deterministic synthetic matrix.yaml in the shared source
    workspace so `compute-matrix` has something to read. Three cells
    with a mix of gating=true and gating=false, so the assert step
    has signal on both code paths.
  params:
    - name: tools-image
      type: string
      default: docker.io/library/busybox:1.36
      description: |
        Pinned busybox image. Same pin as the other smoke tests in
        this repo for build determinism.
    - name: matrix-file
      type: string
      default: matrix.yaml
      description: |
        Path (relative to the source workspace) to write the synthetic
        matrix.yaml at. Must match the `matrix-file` param threaded to
        the `compute-matrix` Task downstream.
  workspaces:
    - name: source
      mountPath: /workspace/source
  steps:
    - name: seed
      image: $(params.tools-image)
      workingDir: /workspace/source
      env:
        - name: MATRIX_FILE
          value: $(params.matrix-file)
      script: |
        #!/bin/sh
        set -eu

        # Three cells: two gating, one non-gating. The non-gating cell
        # exercises the `gating: false` → "false" string-coercion path.
        # Kept tiny on purpose — the smoke is about the Task's parse +
        # emit path, not about exercising the real production matrix.
        cat > "${MATRIX_FILE}" <<'EOF'
        # Synthetic matrix.yaml for compute-matrix-smoke-test.
        # Real source trees ship this at the repo root; see
        # docs/build-matrix.md for the schema.
        cells:
          - distro: centos10
            arch: x86_64
            gating: true
          - distro: ubuntu-noble
            arch: aarch64
            gating: true
          - distro: fedora-rawhide
            arch: x86_64
            gating: false
        EOF

        echo "[seed] staged source workspace:"
        ls -la /workspace/source
        echo
        echo "[seed] ${MATRIX_FILE} contents:"
        cat "${MATRIX_FILE}"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: compute-matrix-smoke-assert
spec:
  description: |
    Assert that `compute-matrix` emitted a well-formed JSON array and
    that the scalar Results agree with it. We thread the upstream
    Results in as Pipeline params and re-parse them in-pod via yq, so
    this Task needs no cluster RBAC against TaskRuns and runs on any
    dev SA. Same pattern as vuln-scan-smoke-assert.
  params:
    - name: matrix
      type: string
      description: |
        Upstream `matrix` Result — JSON array of {distro, arch, gating}
        objects.
    - name: cell-count
      type: string
      description: |
        Upstream `cell-count` Result. Must equal len(matrix) and must
        be a positive integer.
    - name: gating-count
      type: string
      description: |
        Upstream `gating-count` Result. Must equal the count of cells
        whose .gating == "true", and must be <= cell-count.
    - name: expected-cell-count
      type: string
      default: "3"
      description: |
        Cell count the smoke seed wrote. Lets the assert step catch a
        regression where compute-matrix silently dropped a cell.
    - name: expected-gating-count
      type: string
      default: "2"
      description: |
        Gating-count the smoke seed implies (two cells with gating:true,
        one with gating:false).
    - name: tools-image
      type: string
      default: docker.io/mikefarah/yq:4.40.7
      description: |
        Same pin as the compute-matrix Task itself — yq is the cleanest
        tool for re-validating the JSON shape inside a Tekton step.
  steps:
    - name: assert
      image: $(params.tools-image)
      env:
        - name: MATRIX
          value: $(params.matrix)
        - name: CELL_COUNT
          value: $(params.cell-count)
        - name: GATING_COUNT
          value: $(params.gating-count)
        - name: EXPECTED_CELL_COUNT
          value: $(params.expected-cell-count)
        - name: EXPECTED_GATING_COUNT
          value: $(params.expected-gating-count)
      script: |
        #!/bin/sh
        set -eu
        FAIL=0

        echo "[assert] matrix=${MATRIX}"
        echo "[assert] cell-count=${CELL_COUNT}"
        echo "[assert] gating-count=${GATING_COUNT}"
        echo "[assert] expected-cell-count=${EXPECTED_CELL_COUNT}"
        echo "[assert] expected-gating-count=${EXPECTED_GATING_COUNT}"
        echo

        # ---- matrix parses as JSON array ----
        if ! printf '%s' "${MATRIX}" | yq -p=json -o=json '.' >/dev/null 2>&1; then
          echo "[assert] FAIL: matrix does not parse as JSON" >&2
          FAIL=1
        fi
        # `yq tag` returns the YAML type tag of the document root.
        # For a JSON array the tag is `!!seq`; for any other shape
        # (object, string, scalar) it'll be something else and we
        # fail loud.
        TAG="$(printf '%s' "${MATRIX}" | yq -p=json '. | tag' 2>/dev/null || echo unknown)"
        if [ "${TAG}" != "!!seq" ]; then
          echo "[assert] FAIL: matrix root is not an array (yq tag=${TAG})" >&2
          FAIL=1
        fi

        # ---- every entry has distro / arch / gating ----
        # Length-after-filter trick: equal counts mean every cell
        # passed the predicate. More robust across yq versions than
        # `all(...)`.
        TOTAL_LEN="$(printf '%s' "${MATRIX}" | yq -p=json '. | length' 2>/dev/null || echo 0)"
        SHAPED_LEN="$(
          printf '%s' "${MATRIX}" \
            | yq -p=json '[.[] | select(.distro != null and .arch != null and .gating != null)] | length' 2>/dev/null \
            || echo 0
        )"
        if [ "${SHAPED_LEN}" != "${TOTAL_LEN}" ]; then
          echo "[assert] FAIL: ${TOTAL_LEN} cells but only ${SHAPED_LEN} carry distro/arch/gating" >&2
          FAIL=1
        fi

        # ---- gating is "true" or "false" (string, not bool) ----
        # Tekton matrix params are strings; the Task must coerce the
        # YAML bool into a string. Same length-after-filter trick.
        GATING_OK_LEN="$(
          printf '%s' "${MATRIX}" \
            | yq -p=json '[.[] | select(.gating == "true" or .gating == "false")] | length' 2>/dev/null \
            || echo 0
        )"
        if [ "${GATING_OK_LEN}" != "${TOTAL_LEN}" ]; then
          echo "[assert] FAIL: ${TOTAL_LEN} cells but only ${GATING_OK_LEN} carry gating in ('true','false') as string" >&2
          FAIL=1
        fi

        # ---- cell-count is a positive integer ----
        case "${CELL_COUNT}" in
          ''|*[!0-9]*)
            echo "[assert] FAIL: cell-count='${CELL_COUNT}' is not a non-negative integer" >&2
            FAIL=1
            ;;
          *)
            if [ "${CELL_COUNT}" -lt 1 ]; then
              echo "[assert] FAIL: cell-count=${CELL_COUNT}; expected >= 1" >&2
              FAIL=1
            fi
            ;;
        esac

        # ---- cell-count == len(matrix) ----
        ACTUAL_LEN="$(printf '%s' "${MATRIX}" | yq -p=json '. | length' 2>/dev/null || echo 0)"
        if [ "${ACTUAL_LEN}" != "${CELL_COUNT}" ]; then
          echo "[assert] FAIL: cell-count=${CELL_COUNT} != len(matrix)=${ACTUAL_LEN}" >&2
          FAIL=1
        fi

        # ---- gating-count <= cell-count ----
        case "${GATING_COUNT}" in
          ''|*[!0-9]*)
            echo "[assert] FAIL: gating-count='${GATING_COUNT}' is not a non-negative integer" >&2
            FAIL=1
            ;;
          *)
            if [ "${GATING_COUNT}" -gt "${CELL_COUNT}" ]; then
              echo "[assert] FAIL: gating-count=${GATING_COUNT} > cell-count=${CELL_COUNT}" >&2
              FAIL=1
            fi
            ;;
        esac

        # ---- seeded values: 3 cells, 2 gating ----
        if [ "${CELL_COUNT}" != "${EXPECTED_CELL_COUNT}" ]; then
          echo "[assert] FAIL: cell-count=${CELL_COUNT} != expected ${EXPECTED_CELL_COUNT}" >&2
          FAIL=1
        fi
        if [ "${GATING_COUNT}" != "${EXPECTED_GATING_COUNT}" ]; then
          echo "[assert] FAIL: gating-count=${GATING_COUNT} != expected ${EXPECTED_GATING_COUNT}" >&2
          FAIL=1
        fi

        if [ "${FAIL}" -ne 0 ]; then
          echo "[assert] one or more assertions failed" >&2
          exit 1
        fi
        echo "[assert] all matrix Result shape assertions passed"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: compute-matrix-smoke-test
spec:
  description: |
    Three-Task pipeline:
      1. `seed`           — stage a deterministic synthetic matrix.yaml
                            in the shared source workspace (3 cells, 2
                            gating, 1 non-gating).
      2. `compute-matrix` — parse it and emit the matrix /
                            cell-count / gating-count Results.
      3. `assert-results` — verify the JSON shape + that the scalar
                            Results agree with the array length and the
                            seeded values.

    See docs/build-matrix.md for the matrix.yaml schema + the
    compute-matrix Task contract + the documented fallback default
    when matrix.yaml is absent.
  params:
    - name: matrix-file
      type: string
      default: matrix.yaml
      description: |
        Path (relative to the source workspace) for the synthetic
        matrix.yaml. Threaded to both the seed Task and the
        compute-matrix Task so they agree on where to read/write.
    - name: tools-image
      type: string
      default: docker.io/mikefarah/yq:4.40.7
      description: |
        yq image, used by compute-matrix + the assert Task. Same pin
        in both spots so the smoke only pulls one image beyond busybox.
    - name: busybox-image
      type: string
      default: docker.io/library/busybox:1.36
      description: |
        Pinned busybox for the seed step. Same pin as the other smoke
        tests in this repo.
  workspaces:
    - name: source
      description: |
        Shared workspace where the seed Task drops matrix.yaml and the
        compute-matrix Task reads it. emptyDir is fine for smoke; real
        pipelines bind the workspace a `git-clone` Task wrote into.
  tasks:
    - name: seed
      taskRef:
        name: compute-matrix-smoke-seed
      params:
        - name: tools-image
          value: $(params.busybox-image)
        - name: matrix-file
          value: $(params.matrix-file)
      workspaces:
        - name: source
          workspace: source
    - name: compute-matrix
      runAfter: [seed]
      taskRef:
        name: compute-matrix
      params:
        - name: source-ref
          value: smoke-synthetic
        - name: matrix-file
          value: $(params.matrix-file)
        - name: tools-image
          value: $(params.tools-image)
      workspaces:
        - name: source
          workspace: source
    - name: assert-results
      runAfter: [compute-matrix]
      taskRef:
        name: compute-matrix-smoke-assert
      params:
        - name: matrix
          value: $(tasks.compute-matrix.results.matrix)
        - name: cell-count
          value: $(tasks.compute-matrix.results.cell-count)
        - name: gating-count
          value: $(tasks.compute-matrix.results.gating-count)
        - name: tools-image
          value: $(params.tools-image)
  results:
    # Re-expose the compute-matrix Results at the Pipeline level so a
    # caller running this as a child Pipeline (or an e2e assert script
    # pulling Results off the PipelineRun) can read them without
    # following the child-TaskRun pointer.
    - name: matrix
      description: |
        JSON array of {distro, arch, gating} cells, the same shape
        downstream Tasks consume via `matrix: { include: ... }`.
      value: $(tasks.compute-matrix.results.matrix)
    - name: cell-count
      description: Integer cell count (decimal string).
      value: $(tasks.compute-matrix.results.cell-count)
    - name: gating-count
      description: Integer gating-cell count (decimal string).
      value: $(tasks.compute-matrix.results.gating-count)

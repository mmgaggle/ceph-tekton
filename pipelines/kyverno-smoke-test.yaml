# Kyverno smoke-test pipeline.
#
# Proves the dev cluster's Kyverno install + verify-ceph-image-signatures-dev
# ClusterPolicy reject unsigned Ceph images and admit signed ones. Two
# TaskRuns run in parallel:
#
#   1. admit-signed-ceph: attempts to create a Pod referencing a
#      quay.io/ceph/ceph image known to be signed by the dev cosign key
#      (the same image the Chains smoke-test attested to, by tag).
#      Expects admission; fails the Task if Kyverno blocks.
#
#   2. reject-unsigned: attempts to create a Pod referencing
#      docker.io/library/busybox:1.36. That image is outside the
#      `quay.io/ceph/*` glob, so the policy will skip it — wrong test.
#      Instead we point at quay.io/ceph/ceph:does-not-exist-unsigned
#      (a tag that has no Chains attestation in this cluster's
#      signing-secrets Secret). That makes the policy fire and reject.
#      The Task then asserts the rejection reason mentions cosign or
#      signature verification.
#
# Pre-req: hack/dev-kyverno-up.sh has already applied the dev policy
# and Kyverno's admission webhook is ready.
#
# Run via:
#   ./hack/dev-kyverno-up.sh   # one-time bootstrap (idempotent)
#   kubectl apply -f pipelines/kyverno-smoke-test.yaml
#   tkn pipeline start kyverno-smoke-test \
#     --serviceaccount kyverno-smoke-sa \
#     -n kyverno-smoke \
#     --showlog
#
# The pipeline runs in its own `kyverno-smoke` namespace which is NOT
# in the chart's webhook-exclusion list (intentional — the namespace
# must be one the policy enforces in, or the test is vacuous). The
# kyverno-smoke-sa ServiceAccount is given pods/create RBAC by the
# accompanying Role + RoleBinding below.

---
# ----------------------------------------------------------------------
# Namespace + RBAC for the smoke-test pods.
# ----------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno-smoke
  labels:
    # Explicitly NOT labelled ceph-tekton.io/cluster=sepia so the dev
    # policy enforces here. The dev policy's namespaceSelector uses
    # NotIn [sepia], which matches namespaces that either lack the
    # label entirely OR have it set to something other than `sepia`.
    # The kyverno-smoke namespace lacks it → dev policy matches →
    # verifyImages enforces.
    ceph-tekton.io/scope: smoke-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kyverno-smoke-sa
  namespace: kyverno-smoke
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-smoke-pods
  namespace: kyverno-smoke
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-smoke-pods
  namespace: kyverno-smoke
subjects:
  - kind: ServiceAccount
    name: kyverno-smoke-sa
    namespace: kyverno-smoke
roleRef:
  kind: Role
  name: kyverno-smoke-pods
  apiGroup: rbac.authorization.k8s.io

---
# ----------------------------------------------------------------------
# Task: try-pod-admit
# ----------------------------------------------------------------------
# Generic helper Task that attempts to create a Pod with a given image
# and asserts that admission either succeeded or failed in the
# expected direction. Used by both branches of the smoke-test pipeline.
#
# Two params do most of the work:
#   - `image`: the image reference to bake into the test Pod.
#   - `expect`: "admit" or "reject". The Task's exit code maps to
#     whether the expectation matched.
#
# When `expect=reject`, the Task ADDITIONALLY asserts that the
# kubectl error message mentions cosign/signature so we know the
# rejection came from our ClusterPolicy and not (say) a kubelet
# image-pull failure or a different admission controller.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: try-pod-admit
spec:
  description: >
    Try to create a Pod with the given image; assert admission outcome.
    Asserts the rejection reason on `expect=reject` to confirm Kyverno
    was the rejecter.
  params:
    - name: image
      type: string
      description: Image reference to bake into the test pod.
    - name: expect
      type: string
      description: "'admit' or 'reject'."
    - name: pod-name
      type: string
      description: Name to give the test pod (must be unique within the namespace).
    - name: namespace
      type: string
      default: kyverno-smoke
    - name: kubectl-image
      type: string
      default: "docker.io/bitnami/kubectl:1.30"
      description: Image providing the `kubectl` CLI for the test step.
  steps:
    - name: try-create
      image: $(params.kubectl-image)
      script: |
        #!/bin/sh
        set -eu

        EXPECT="$(params.expect)"
        IMG="$(params.image)"
        POD="$(params.pod-name)"
        NS="$(params.namespace)"

        case "$EXPECT" in
          admit|reject) ;;
          *) echo "FAIL: bad expect value '$EXPECT' (want admit|reject)"; exit 2 ;;
        esac

        # Best-effort cleanup from a prior run.
        kubectl -n "$NS" delete pod "$POD" --ignore-not-found --wait=false >/dev/null 2>&1 || true

        echo "==> creating pod $NS/$POD with image $IMG (expecting: $EXPECT)"

        # Apply via stdin manifest. --dry-run=server runs the admission
        # webhooks but does NOT persist the Pod (no kubelet pull, no
        # scheduling) — so the test is hermetic. Kyverno's
        # verifyImages rule runs on server-side dry-run apply.
        OUT=$(mktemp)
        RC=0
        kubectl -n "$NS" apply --dry-run=server -f - <<EOF >"$OUT" 2>&1 || RC=$?
        apiVersion: v1
        kind: Pod
        metadata:
          name: ${POD}
          namespace: ${NS}
          labels:
            ceph-tekton.io/test: kyverno-smoke
        spec:
          # never-restart + pause image inside the spec just exists so
          # the Pod is syntactically valid for kubelet should the test
          # later remove --dry-run=server. The admission decision is
          # based on the .spec.containers[].image we want to test.
          restartPolicy: Never
          containers:
            - name: target
              image: ${IMG}
              command: ["/bin/sh", "-c", "sleep 5"]
        EOF

        echo "---- kubectl output ----"
        cat "$OUT"
        echo "---- exit code: $RC ----"

        if [ "$EXPECT" = "admit" ]; then
          if [ "$RC" -eq 0 ]; then
            echo "OK: pod was admitted as expected"
            exit 0
          fi
          echo "FAIL: pod was rejected but admission was expected"
          exit 1
        fi

        # expect=reject
        if [ "$RC" -eq 0 ]; then
          echo "FAIL: pod was admitted but rejection was expected"
          echo "      (the policy did not fire — image glob mismatch, or"
          echo "       the policy is not in Enforce mode in this namespace)"
          exit 1
        fi

        # Rejection happened — confirm it came from our ClusterPolicy
        # and not some other admission controller. Kyverno's verifyImages
        # error message includes either "cosign" or "signature" verbatim;
        # ClusterPolicy name shows up too. Grep case-insensitively for
        # any of those markers.
        if grep -Eqi 'cosign|signature|verify-ceph-image-signatures' "$OUT"; then
          echo "OK: rejection reason mentions cosign/signature/policy name"
          exit 0
        fi

        echo "FAIL: pod was rejected but the reason does not mention"
        echo "      cosign / signature / our policy name — something"
        echo "      other than Kyverno blocked the create. See output above."
        exit 1

---
# ----------------------------------------------------------------------
# Pipeline: kyverno-smoke-test
# ----------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: kyverno-smoke-test
spec:
  description: >
    End-to-end smoke test of the dev Kyverno install + the
    verify-ceph-image-signatures-dev ClusterPolicy. Runs two TaskRuns
    in parallel: one Pod-create expected to be admitted (signed Ceph
    image), one expected to be rejected with a cosign/signature
    error message (unsigned image under quay.io/ceph/*).
  params:
    # The signed-image tag the cluster's signing-secrets cosign.pub
    # can verify. Override at `tkn pipeline start` time once the
    # Chains-signed Ceph image lands at a known tag (issue #25).
    # Until then, the admit-signed-ceph branch will FAIL by design —
    # there is no real Chains-signed quay.io/ceph/ceph image yet
    # that the dev cosign.pub can verify. That's intentional: this
    # parameter is the integration seam between the kyverno policy
    # workstream (#47) and the container-build workstream (#25 / #26).
    - name: signed-ceph-image
      type: string
      default: "quay.io/ceph/ceph:v19.2.0"
      description: >
        A quay.io/ceph/* image reference whose cosign signature the
        local signing-secrets Secret can verify. Until #25/#26 lands
        a real Chains-signed image, expect this TaskRun to fail.
    - name: unsigned-ceph-image
      type: string
      default: "quay.io/ceph/ceph:smoke-test-deliberately-unsigned"
      description: >
        A quay.io/ceph/* image reference that has no cosign signature
        in the cluster's signing-secrets. Used to prove the policy
        rejects on missing/invalid signatures.
  tasks:
    - name: admit-signed-ceph
      taskRef:
        name: try-pod-admit
      params:
        - name: image
          value: $(params.signed-ceph-image)
        - name: expect
          value: admit
        - name: pod-name
          value: smoke-admit-signed
    - name: reject-unsigned-ceph
      taskRef:
        name: try-pod-admit
      params:
        - name: image
          value: $(params.unsigned-ceph-image)
        - name: expect
          value: reject
        - name: pod-name
          value: smoke-reject-unsigned

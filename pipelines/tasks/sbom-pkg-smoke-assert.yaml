# sbom-pkg-smoke-test — `sbom-pkg-smoke-assert` Task.
#
# Asserts that `generate-sbom` emitted the expected Chains-grammar
# Results — both the declared plural Results Chains actually consumes
# (`IMAGES`, `ARTIFACT_OUTPUTS`) and the contract-level indices
# (`SBOM_NAMES`, `SBOM_COUNT`, `SBOM_MEDIATYPE`).
#
# We wire the upstream Results in as Pipeline params and grep them
# in-pod, so this Task needs no cluster RBAC against TaskRuns and runs
# on any dev SA.
#
# Pairs with pipelines/pipelines/sbom-pkg-smoke-test.yaml.
#
# Single-resource file (no leading `---`) so PaC's remote-resolution
# (`pipelinesascode.tekton.dev/task: sbom-pkg-smoke-assert@URL`) succeeds.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sbom-pkg-smoke-assert
spec:
  description: |
    Assert that `generate-sbom` emitted the expected Chains-grammar
    Results — both the declared plural Results Chains actually
    consumes (`IMAGES`, `ARTIFACT_OUTPUTS`) and the contract-level
    indices (`SBOM_NAMES`, `SBOM_COUNT`, `SBOM_MEDIATYPE`).

    We wire the upstream Results in as Pipeline params and grep them
    in-pod, so this Task needs no cluster RBAC against TaskRuns and
    runs on any dev SA.
  params:
    - name: images
      type: string
      description: |
        Upstream `IMAGES` Result — newline-separated
        `<url>@sha256:<digest>` pairs.
    - name: artifact-outputs
      type: string
      description: |
        Upstream `ARTIFACT_OUTPUTS` Result — JSON array of per-artifact
        descriptors with nested SBOM block.
    - name: sbom-names
      type: string
      description: |
        Upstream `SBOM_NAMES` Result — newline-separated slug index.
    - name: sbom-count
      type: string
      description: Upstream `SBOM_COUNT` Result.
    - name: sbom-mediatype
      type: string
      description: Upstream `SBOM_MEDIATYPE` Result.
    - name: expected-count
      type: string
      default: "2"
      description: |
        Expected number of (artifact, SBOM) pairs. The seed Task
        stages two .tar files, so the default is 2.
    - name: expected-name-substrings
      type: string
      default: "FAKE_PKG_A FAKE_PKG_B"
      description: |
        Space-separated list of substrings that MUST appear in the
        SBOM_NAMES output. Matches the slugged form of the seeded
        artifact basenames (`fake-pkg-a_1.0.tar` -> `FAKE_PKG_A`).
    - name: tools-image
      type: string
      default: docker.io/library/busybox:1.36
  steps:
    - name: assert
      image: $(params.tools-image)
      env:
        - name: IMAGES
          value: $(params.images)
        - name: ARTIFACT_OUTPUTS
          value: $(params.artifact-outputs)
        - name: SBOM_NAMES
          value: $(params.sbom-names)
        - name: SBOM_COUNT
          value: $(params.sbom-count)
        - name: SBOM_MEDIATYPE
          value: $(params.sbom-mediatype)
        - name: EXPECTED_COUNT
          value: $(params.expected-count)
        - name: EXPECTED_NAMES
          value: $(params.expected-name-substrings)
      script: |
        #!/bin/sh
        set -eu
        FAIL=0

        echo "[assert] SBOM_COUNT='${SBOM_COUNT}' (expected '${EXPECTED_COUNT}')"
        if [ "${SBOM_COUNT}" != "${EXPECTED_COUNT}" ]; then
          echo "[assert] FAIL: SBOM_COUNT mismatch" >&2
          FAIL=1
        fi

        echo "[assert] SBOM_MEDIATYPE='${SBOM_MEDIATYPE}'"
        if [ "${SBOM_MEDIATYPE}" != "application/vnd.cyclonedx+json" ]; then
          echo "[assert] FAIL: SBOM_MEDIATYPE must be application/vnd.cyclonedx+json" >&2
          FAIL=1
        fi

        echo "[assert] SBOM_NAMES contents:"
        printf '%s\n' "${SBOM_NAMES}"

        for needle in ${EXPECTED_NAMES}; do
          if printf '%s\n' "${SBOM_NAMES}" | grep -q "${needle}"; then
            echo "[assert] OK:   SBOM_NAMES contains '${needle}'"
          else
            echo "[assert] FAIL: SBOM_NAMES missing '${needle}'" >&2
            FAIL=1
          fi
        done

        # IMAGES Result: one `<url>@sha256:<hex>` line per artifact.
        IMG_LINES=$(printf '%s\n' "${IMAGES}" | grep -c '@sha256:' || true)
        echo "[assert] IMAGES line count: ${IMG_LINES} (expected ${EXPECTED_COUNT})"
        if [ "${IMG_LINES}" != "${EXPECTED_COUNT}" ]; then
          echo "[assert] FAIL: IMAGES must have one <url>@sha256:<hex> line per artifact" >&2
          echo "[assert] got IMAGES:" >&2
          printf '%s\n' "${IMAGES}" >&2
          FAIL=1
        fi

        # ARTIFACT_OUTPUTS Result: JSON array. Busybox has no jq, so we
        # validate by counting top-level `{"name":` occurrences (which
        # is one per entry in our shape) and by asserting the media
        # type appears exactly that many times.
        AO_NAMES=$(printf '%s' "${ARTIFACT_OUTPUTS}" | grep -o '"name":"[^"]*"' | wc -l | awk '{print $1}')
        echo "[assert] ARTIFACT_OUTPUTS entry count: ${AO_NAMES} (expected ${EXPECTED_COUNT})"
        if [ "${AO_NAMES}" != "${EXPECTED_COUNT}" ]; then
          echo "[assert] FAIL: ARTIFACT_OUTPUTS must have one entry per artifact" >&2
          echo "[assert] got ARTIFACT_OUTPUTS:" >&2
          printf '%s\n' "${ARTIFACT_OUTPUTS}" >&2
          FAIL=1
        fi
        AO_MEDIATYPES=$(printf '%s' "${ARTIFACT_OUTPUTS}" \
          | grep -o 'application/vnd.cyclonedx+json' | wc -l | awk '{print $1}')
        if [ "${AO_MEDIATYPES}" != "${EXPECTED_COUNT}" ]; then
          echo "[assert] FAIL: ARTIFACT_OUTPUTS must embed CycloneDX mediaType per entry" >&2
          FAIL=1
        fi

        if [ "${FAIL}" -ne 0 ]; then
          echo "[assert] one or more assertions failed" >&2
          exit 1
        fi
        echo "[assert] all Chains plural Results present and well-formed"

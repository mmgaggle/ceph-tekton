# Vault smoke-test — `vault-sign-smoke` Task.
#
# Authenticates to Vault via the projected SA token (k8s auth method),
# signs a known payload with transit/keys/ceph-test-key, asserts the
# response contains a `vault:v<n>:<b64>` signature, then verifies it.
#
# Pairs with pipelines/pipelines/vault-smoke-test.yaml. The Pipeline
# MUST run in the `vault-test` namespace with the `ceph-test-signer`
# ServiceAccount (that pair is bound to the Vault role created by
# hack/dev-vault-up.sh). Any other pod identity is rejected at
# `auth/kubernetes/login`.
#
# Single-resource file (no leading `---`) so PaC's remote-resolution
# (`pipelinesascode.tekton.dev/task: vault-sign-smoke@URL`) succeeds.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: vault-sign-smoke
  annotations:
    description: >
      Authenticate to Vault via the projected SA token (k8s auth method),
      sign a known payload with transit/keys/ceph-test-key, assert the
      response contains a signature field.
spec:
  description: >
    Vault smoke-test: SA-token → k8s auth → transit sign → assert
    signature.
  params:
    - name: vault-addr
      type: string
      default: "http://vault.vault.svc.cluster.local:8200"
      description: In-cluster Vault API endpoint.
    - name: vault-role
      type: string
      default: "ceph-test-signer"
      description: Vault k8s-auth role to authenticate against.
    - name: transit-key
      type: string
      default: "ceph-test-key"
      description: transit key path component (transit/sign/<this>).
    - name: payload
      type: string
      default: "hello vault"
      description: Plaintext payload to sign (will be base64-encoded).
    - name: vault-image
      type: string
      default: "docker.io/hashicorp/vault:1.17.2"
      description: >
        Image providing the `vault` CLI. Pinned to match the appVersion
        of the chart in charts/vault/README.md.
  # Explicit emptyDir shared between steps for SA-token + client-token
  # handoff. Tekton's implicit /workspace is also an emptyDir per pod,
  # but mounting our own keeps the data path obvious to a reviewer.
  volumes:
    - name: vault-scratch
      emptyDir:
        medium: Memory
  stepTemplate:
    volumeMounts:
      - name: vault-scratch
        mountPath: /vault-scratch
  steps:
    # Step 1: project the SA token into the workspace as a JWT for
    # the Vault login API. Tekton mounts a default SA token already
    # but we want a token with `vault` as the audience so the issuer
    # validation on Vault's side accepts it.
    - name: write-sa-token
      image: docker.io/library/busybox:1.36
      script: |
        #!/bin/sh
        set -eu
        # The Tekton pod already has a projected SA token mounted
        # by Kubernetes at the standard path. For the Vault k8s auth
        # method we just need the JWT string.
        TOKEN_PATH=/var/run/secrets/kubernetes.io/serviceaccount/token
        if [ ! -s "$TOKEN_PATH" ]; then
          echo "FAIL: no SA token at $TOKEN_PATH — is this pod running with a real SA?"
          exit 1
        fi
        cp "$TOKEN_PATH" /vault-scratch/sa.jwt
        chmod 0400 /vault-scratch/sa.jwt
        echo "OK: SA token captured ($(wc -c < /vault-scratch/sa.jwt) bytes)"

    # Step 2: log in to Vault using the SA token. On success, write
    # the returned client_token to /workspace/vault/client.token.
    - name: vault-login
      image: $(params.vault-image)
      env:
        - name: VAULT_ADDR
          value: $(params.vault-addr)
      script: |
        #!/bin/sh
        set -eu
        SA_JWT="$(cat /vault-scratch/sa.jwt)"
        # vault write -format=json returns:
        #   { "auth": { "client_token": "...", ... }, ... }
        # Use the CLI's -field selector so we don't need jq.
        TOKEN=$(vault write -field=token \
                  auth/kubernetes/login \
                  role=$(params.vault-role) \
                  jwt="$SA_JWT")
        if [ -z "$TOKEN" ]; then
          echo "FAIL: vault login returned an empty client_token"
          exit 1
        fi
        printf '%s' "$TOKEN" > /vault-scratch/client.token
        chmod 0400 /vault-scratch/client.token
        echo "OK: vault login succeeded for role $(params.vault-role)"

    # Step 3: sign a known payload. Assert the response includes a
    # `signature` field starting with `vault:`. That prefix is the
    # transit engine's canonical signature format
    # (vault:v<key-version>:<base64-signature>) — its presence proves
    # the request went all the way through the transit backend and
    # back.
    - name: vault-sign
      image: $(params.vault-image)
      env:
        - name: VAULT_ADDR
          value: $(params.vault-addr)
      script: |
        #!/bin/sh
        set -eu
        VAULT_TOKEN="$(cat /vault-scratch/client.token)"
        export VAULT_TOKEN
        PAYLOAD_B64=$(printf '%s' "$(params.payload)" | base64 | tr -d '\n')
        echo "signing payload: $(params.payload)"
        echo "base64:          $PAYLOAD_B64"
        SIG=$(vault write -field=signature \
                transit/sign/$(params.transit-key) \
                input="$PAYLOAD_B64")
        echo "got signature: $SIG"
        case "$SIG" in
          vault:v*:*)
            echo "OK: signature has the expected vault:v<n>:<b64> shape"
            ;;
          *)
            echo "FAIL: signature does not look like a transit response: $SIG"
            exit 1
            ;;
        esac
        # Bonus: verify with the same key to catch any silent key-id
        # / version mismatch.
        VERIFIED=$(vault write -field=valid \
                     transit/verify/$(params.transit-key) \
                     input="$PAYLOAD_B64" \
                     signature="$SIG")
        if [ "$VERIFIED" != "true" ]; then
          echo "FAIL: vault could not verify the signature it just produced"
          exit 1
        fi
        echo "OK: vault verified the signature — smoke test passed"

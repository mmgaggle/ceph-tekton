# verify-image-signature-keyless-smoke-test — smoke Pipeline for the
# KEYLESS mode of `tasks/verify-image-signature`.
#
# Companion to the keyed smoke (#93's verify-image-signature-smoke-test).
# Where the keyed smoke needs an in-cluster registry + ephemeral keys
# + host-side signing, the keyless smoke is much simpler: we verify a
# real public keyless-signed image whose certificate identity is
# stable across releases.
#
# TEST TARGET — ghcr.io/sigstore/cosign/cosign:v2.4.1.
# This is the same image we already pin as the default `cosign-image`
# in tasks/attach-sbom + tasks/build-grype-db. Verifying its keyless
# signature here gives the suite a real supply-chain canary: if
# sigstore ever re-tags v2.4.1 from a different release pipeline,
# this smoke breaks loudly.
#
# Pinning the image-index digest (not the per-arch digest):
#   `sha256:b03690aa52bfe94054187142fba24dc54137650682810633901767d8a3e15b31`
# That's the OCI image-index manifest; cosign signs the index, not the
# per-arch manifests. Captured 2026-05-28 via direct ghcr.io API fetch
# (HEAD /v2/sigstore/cosign/cosign/manifests/v2.4.1).
#
# IDENTITY — verified by extracting the actual Fulcio cert off the
# .sig artifact attached to the image digest:
#
#   $ curl -H "Authorization: Bearer ${TOKEN}" \
#       https://ghcr.io/v2/sigstore/cosign/cosign/manifests/sha256-<hex>.sig \
#       | jq -r '.layers[1].annotations["dev.sigstore.cosign/certificate"]' \
#       | openssl x509 -text -noout
#
#   X509v3 Subject Alternative Name: critical
#       email:keyless@projectsigstore.iam.gserviceaccount.com
#   1.3.6.1.4.1.57264.1.1:  (the Fulcio OIDC-issuer OID)
#       https://accounts.google.com
#
# Cosign releases are signed via Google Cloud Build using a GCP
# service account — NOT a GitHub Actions workflow identity (despite
# the surface appearance: the sigstore/cosign `Cut Release` workflow
# only triggers a `gcloud builds submit` against
# release/cloudbuild.yaml, and the actual cosign sign happens in GCB
# with GOOGLE_SERVICE_ACCOUNT_NAME=keyless@projectsigstore...).
#
# Why this is a STABLE pinning:
#   - `keyless@projectsigstore.iam.gserviceaccount.com` is the SAME
#     SA across cosign releases; bumping the test target only needs
#     a digest update, not an identity rewrite.
#   - `https://accounts.google.com` is Google's OIDC root.
#   - The image digest is content-addressed; sigstore garbage-
#     collecting it would surface as a "manifest not found" error,
#     not as a silently-wrong test.
#
# ignore-tlog=false on PURPOSE: the production callers will hit
# Rekor; this smoke exercises that path so a Rekor-side regression
# (lookup logic, network policy blocking egress to rekor.sigstore.dev,
# cosign client-side change) is caught here rather than in prod.
# Rekor flakes occasionally; the existing chains-smoke pattern uses
# 3-attempt retries — if this smoke flakes the same fix applies.
#
# allow-http=false because ghcr.io is HTTPS-only. No reason to opt
# into the insecure-registry path for this smoke.
#
# Pairs with:
#   - pipelines/tasks/verify-image-signature-smoke-assert.yaml  (REUSED from #93)
#   - tasks/verify-image-signature/task.yaml                    (REUSED from #93)
#   - hack/e2e/assert-verify-image-signature-keyless-smoke.sh   (driver)
#
# DEPENDS ON #93 — the Task + assert YAMLs must be in main before
# this Pipeline can be applied. Filed as #94's tracking issue.
#
# Single-resource file (no leading `---`) so PaC's remote-resolution
# (`pipelinesascode.tekton.dev/pipeline: verify-image-signature-keyless-smoke-test@URL`)
# succeeds.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: verify-image-signature-keyless-smoke-test
spec:
  description: |
    Two-Task pipeline exercising `verify-image-signature` in KEYLESS
    mode against the public sigstore cosign release image.

      1. `verify`         — cosign verify against the pinned
                            ghcr.io/sigstore/cosign/cosign@<digest>
                            with --certificate-identity +
                            --certificate-oidc-issuer matching the
                            Fulcio cert on that signature.
                            ignore-tlog=false exercises the real
                            Rekor inclusion-check path.
      2. `assert-results` — verify each Result is shape-correct:
                            verified="true", subject-digest matches
                            the pinned digest, certificate-identity
                            is non-empty (echo-back of the param),
                            signing-time is a real RFC 3339 UTC
                            timestamp (Rekor entry resolved).

    See header comments for the certificate-identity provenance and
    why this pinning is stable across cosign releases.
  params:
    - name: image
      type: string
      default: "ghcr.io/sigstore/cosign/cosign@sha256:b03690aa52bfe94054187142fba24dc54137650682810633901767d8a3e15b31"
      description: |
        Pinned cosign v2.4.1 OCI image index digest. To bump when a
        new cosign release ships:
          curl -sS "https://ghcr.io/token?service=ghcr.io&scope=repository:sigstore/cosign/cosign:pull" \
            | jq -r .token
          curl -sS -H "Authorization: Bearer $TOKEN" -I \
              "https://ghcr.io/v2/sigstore/cosign/cosign/manifests/v<NEW>" \
            | grep docker-content-digest
        Then verify the identity by extracting the cert off the
        new digest's .sig artifact (see header).
    - name: certificate-identity
      type: string
      default: "keyless@projectsigstore.iam.gserviceaccount.com"
      description: |
        Expected Fulcio SAN-email on the signing cert. Stable across
        cosign releases (it's the same GCP SA the cosign Cloud Build
        signer has used for years).
    - name: certificate-oidc-issuer
      type: string
      default: "https://accounts.google.com"
      description: |
        Expected OIDC issuer (extension OID 1.3.6.1.4.1.57264.1.1 on
        the Fulcio cert). Stable — Google's OIDC root.
    - name: rekor-url
      type: string
      default: "https://rekor.sigstore.dev"
      description: |
        Rekor instance to query for inclusion proof. Public Sigstore
        Rekor is the canonical store for sigstore's own image
        signatures.
    - name: cosign-image
      type: string
      default: cgr.dev/chainguard/cosign:latest-dev
    - name: tools-image
      type: string
      default: docker.io/library/busybox:1.36
  # No workspaces — keyless verify needs none (no public-key file to
  # mount). cosign embeds the Fulcio root trust bundle by default, so
  # there's no on-disk material to project either.
  tasks:
    - name: verify
      taskRef:
        name: verify-image-signature
      params:
        - name: image
          value: $(params.image)
        - name: certificate-identity
          value: $(params.certificate-identity)
        - name: certificate-oidc-issuer
          value: $(params.certificate-oidc-issuer)
        - name: rekor-url
          value: $(params.rekor-url)
        # ignore-tlog=false on purpose — real Rekor lookup exercises
        # the production code path. allow-http=false because ghcr.io
        # is HTTPS-only.
        - name: ignore-tlog
          value: "false"
        - name: allow-http
          value: "false"
        - name: cosign-image
          value: $(params.cosign-image)
        - name: tools-image
          value: $(params.tools-image)
    - name: assert-results
      runAfter: [verify]
      taskRef:
        name: verify-image-signature-smoke-assert
      params:
        - name: verified
          value: $(tasks.verify.results.verified)
        - name: subject-digest
          value: $(tasks.verify.results.subject-digest)
        - name: certificate-identity
          value: $(tasks.verify.results.certificate-identity)
        - name: signing-time
          value: $(tasks.verify.results.signing-time)
        - name: expected-mode
          value: "keyless"
        - name: tools-image
          value: $(params.tools-image)
  results:
    # Re-expose Results at Pipeline level for dashboards / the
    # ceph-builds-api shim. Same posture as the keyed smoke.
    - name: verified
      description: Literal "true" when keyless verify succeeded.
      value: $(tasks.verify.results.verified)
    - name: subject-digest
      description: sha256:<hex> of the verified image.
      value: $(tasks.verify.results.subject-digest)
    - name: certificate-identity
      description: Echo-back of the Fulcio SAN identity verified against.
      value: $(tasks.verify.results.certificate-identity)
    - name: signing-time
      description: Rekor integratedTime as RFC 3339 UTC.
      value: $(tasks.verify.results.signing-time)

# Smoke-test Pipeline. Proves the dev cluster's Tekton install is functional
# end-to-end (Pipeline → PipelineRun → TaskRun → Pod → completion). Used by
# `make dev-test` and by the contributor onboarding guide.
#
# Pairs with pipelines/tasks/hello.yaml (the `hello` Task). Apply the Task
# first; the Pipeline references it by name.
#
# Single-resource file (no leading `---`) so PaC's remote-resolution
# (`pipelinesascode.tekton.dev/pipeline: hello-world@URL`) succeeds —
# PaC reads the URI as exactly one Pipeline.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: hello-world
spec:
  description: Smoke-test pipeline; greets via the hello Task.
  params:
    - name: who
      type: string
      default: world
  tasks:
    - name: greet
      taskRef:
        name: hello
      params:
        - name: who
          value: $(params.who)

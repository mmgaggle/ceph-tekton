# sbom-pkg-smoke-test — smoke pipeline for the `generate-sbom` Task.
#
# Wires `generate-sbom` against the cheapest possible "package"
# artifacts that still prove the Task end-to-end:
#
#   - A `sbom-pkg-smoke-seed` Task creates two deterministic .tar
#     files ("fake-pkg-a_1.0.tar", "fake-pkg-b_1.0.tar") in the
#     shared artifacts workspace. Same deterministic-tar pattern as
#     pipelines/reproducibility-check.yaml — same flags, same intent
#     (sort=name, mtime=@SOURCE_DATE_EPOCH, owner=0, numeric-owner).
#
#   - `generate-sbom` scans them with syft, writes one
#     <basename>.cdx.json per artifact into the sboms workspace, and
#     emits the Chains-valid plural Results (`IMAGES`, `SBOM_IMAGES`)
#     plus the Chains-valid byproduct object Result
#     (`sbom-ARTIFACT_OUTPUTS`). See `tasks/generate-sbom/task.yaml`
#     header for the full rationale of the Result shape and why the
#     #50 grammar (`SBOM_NAMES`/`SBOM_COUNT`/`SBOM_MEDIATYPE` +
#     nested-sbom `ARTIFACT_OUTPUTS`) was retired in #55.
#
#   - `sbom-pkg-smoke-assert` greps every Result for shape
#     conformance: `IMAGES` has one `<url>@sha256:<hex>` line per
#     seeded artifact, `SBOM_IMAGES` has one matching line per
#     per-artifact SBOM file, and `sbom-ARTIFACT_OUTPUTS` carries a
#     well-formed `{uri, digest, isBuildArtifact}` triplet. If any
#     shape check fails, the PipelineRun fails — the smoke test
#     exists to catch silent regressions in the
#     Chains-grammar contract.
#
# Why .tar instead of real .deb / .rpm:
#   - .deb / .rpm need apt/yum + signing keys + a real package source
#     tree just to produce one valid artefact. That's the build-package
#     Task's job (#16), not this Task's. `generate-sbom` only cares
#     that there are FILES; syft happily produces a CycloneDX SBOM
#     against an arbitrary directory.
#   - When #16 lands, this smoke pipeline stays as-is and a sibling
#     "real" pipeline does `build-package` -> `generate-sbom` against
#     actual .deb / .rpm output.
#
# Why no `attach-sbom` smoke here:
#   - `attach-sbom` is the CONTAINER path (cosign attach sbom against
#     an OCI image reference). The package smoke pipeline has no
#     image to attach to — that path is exercised by
#     `pipelines/chains-smoke-test.yaml` and (when #54 lands) the
#     real container e2e test. Mixing the two in one smoke pipeline
#     would force a registry dependency this smoke is explicitly
#     designed to avoid.
#
# The pipeline runs entirely offline-friendly: no S3 upload, no
# registry pulls beyond syft + busybox + debian-slim (all already
# cached by the other smoke tests).
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sbom-pkg-smoke-seed
spec:
  description: |
    Stage two deterministic synthetic "package" tarballs into the
    shared artifacts workspace, so `generate-sbom` has something to
    scan. Uses the same deterministic-tar flags as the
    reproducibility-check smoke pipeline.
  params:
    - name: seed-image
      type: string
      default: docker.io/library/debian:bookworm-slim
      description: |
        Image with GNU tar (for --mtime / --sort) + coreutils.
        Pin matches reproducibility-check.yaml so we don't pull a
        second base layer on the same dev cluster.
  workspaces:
    - name: artifacts
      mountPath: /workspace/artifacts
  steps:
    - name: seed
      image: $(params.seed-image)
      workingDir: /workspace/artifacts
      script: |
        #!/bin/sh
        set -eu
        # Fixed SOURCE_DATE_EPOCH so the tarball bytes are byte-identical
        # across smoke runs. 1700000000 = 2023-11-14T22:13:20Z, picked
        # purely for being a stable round number after the unix epoch.
        export SOURCE_DATE_EPOCH=1700000000
        export LC_ALL=C
        export TZ=UTC
        umask 022

        mkdir -p src-a/usr/share/doc/fake-pkg-a
        echo "fake package A v1.0"      > src-a/usr/share/doc/fake-pkg-a/README
        echo "0123456789abcdef"         > src-a/usr/share/doc/fake-pkg-a/checksum
        mkdir -p src-b/usr/share/doc/fake-pkg-b
        echo "fake package B v1.0"      > src-b/usr/share/doc/fake-pkg-b/README
        echo "fedcba9876543210"         > src-b/usr/share/doc/fake-pkg-b/checksum

        for pkg in a b; do
          tar cf "fake-pkg-${pkg}_1.0.tar" \
            --mtime=@${SOURCE_DATE_EPOCH} \
            --sort=name \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "src-${pkg}" .
        done

        rm -rf src-a src-b

        echo "[seed] staged artifacts:"
        ls -la /workspace/artifacts
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sbom-pkg-smoke-assert
spec:
  description: |
    Assert that `generate-sbom` emitted the expected Chains-valid
    Results — both the plural Results Chains promotes to subjects
    (`IMAGES`, `SBOM_IMAGES`) and the byproduct object Result
    (`sbom-ARTIFACT_OUTPUTS`).

    We wire the upstream Results in as Pipeline params and grep them
    in-pod, so this Task needs no cluster RBAC against TaskRuns and
    runs on any dev SA.
  params:
    - name: images
      type: string
      description: |
        Upstream `IMAGES` Result — newline-separated
        `<artifact-url>@sha256:<digest>` pairs.
    - name: sbom-images
      type: string
      description: |
        Upstream `SBOM_IMAGES` Result — newline-separated
        `<sbom-url>@sha256:<digest>` pairs, one per per-artifact
        SBOM file. Same Chains grammar as IMAGES; distinct Result
        name so verifier tooling can separate artifact subjects from
        SBOM subjects.
    - name: sbom-artifact-outputs-uri
      type: string
      description: |
        `uri` field from the upstream `sbom-ARTIFACT_OUTPUTS` object
        Result (the rollup SBOM file URL).
    - name: sbom-artifact-outputs-digest
      type: string
      description: |
        `digest` field from the upstream `sbom-ARTIFACT_OUTPUTS`
        object Result.
    - name: sbom-artifact-outputs-isbuildartifact
      type: string
      description: |
        `isBuildArtifact` field from the upstream
        `sbom-ARTIFACT_OUTPUTS` object Result. Must be `"false"` —
        the SBOM is metadata about the build, not the build's
        product.
    - name: expected-count
      type: string
      default: "2"
      description: |
        Expected number of (artifact, SBOM) pairs. The seed Task
        stages two .tar files, so the default is 2.
    - name: tools-image
      type: string
      default: docker.io/library/busybox:1.36
  steps:
    - name: assert
      image: $(params.tools-image)
      env:
        - name: IMAGES
          value: $(params.images)
        - name: SBOM_IMAGES
          value: $(params.sbom-images)
        - name: SBOM_AO_URI
          value: $(params.sbom-artifact-outputs-uri)
        - name: SBOM_AO_DIGEST
          value: $(params.sbom-artifact-outputs-digest)
        - name: SBOM_AO_ISBUILDARTIFACT
          value: $(params.sbom-artifact-outputs-isbuildartifact)
        - name: EXPECTED_COUNT
          value: $(params.expected-count)
      script: |
        #!/bin/sh
        set -eu
        FAIL=0

        # IMAGES Result: one `<artifact-url>@sha256:<hex>` line per artifact.
        IMG_LINES=$(printf '%s\n' "${IMAGES}" | grep -c '@sha256:' || true)
        echo "[assert] IMAGES line count: ${IMG_LINES} (expected ${EXPECTED_COUNT})"
        if [ "${IMG_LINES}" != "${EXPECTED_COUNT}" ]; then
          echo "[assert] FAIL: IMAGES must have one <url>@sha256:<hex> line per artifact" >&2
          echo "[assert] got IMAGES:" >&2
          printf '%s\n' "${IMAGES}" >&2
          FAIL=1
        fi

        # SBOM_IMAGES Result: one `<sbom-url>@sha256:<hex>` line per SBOM file.
        SBOM_LINES=$(printf '%s\n' "${SBOM_IMAGES}" | grep -c '@sha256:' || true)
        echo "[assert] SBOM_IMAGES line count: ${SBOM_LINES} (expected ${EXPECTED_COUNT})"
        if [ "${SBOM_LINES}" != "${EXPECTED_COUNT}" ]; then
          echo "[assert] FAIL: SBOM_IMAGES must have one <url>@sha256:<hex> line per SBOM file" >&2
          echo "[assert] got SBOM_IMAGES:" >&2
          printf '%s\n' "${SBOM_IMAGES}" >&2
          FAIL=1
        fi

        # Every SBOM_IMAGES entry must end in `.cdx.json@sha256:<hex>`,
        # so smoke-time the file extension is the mediaType signal
        # (mediaType isn't carried in the Chains object Result schema).
        BAD_SUFFIX=$(printf '%s\n' "${SBOM_IMAGES}" \
          | grep -v '\.cdx\.json@sha256:' \
          | grep -c '@sha256:' || true)
        if [ "${BAD_SUFFIX}" != "0" ]; then
          echo "[assert] FAIL: SBOM_IMAGES entries must end in .cdx.json@sha256:<hex>" >&2
          FAIL=1
        fi

        # sbom-ARTIFACT_OUTPUTS object Result: shape-check the three
        # required keys (Chains 0.26 schema: uri, digest,
        # isBuildArtifact). No mediaType, no nested sbom.
        echo "[assert] sbom-ARTIFACT_OUTPUTS.uri='${SBOM_AO_URI}'"
        echo "[assert] sbom-ARTIFACT_OUTPUTS.digest='${SBOM_AO_DIGEST}'"
        echo "[assert] sbom-ARTIFACT_OUTPUTS.isBuildArtifact='${SBOM_AO_ISBUILDARTIFACT}'"

        case "${SBOM_AO_URI}" in
          workspace://sboms/*.cdx.json|https://*/sboms/*.cdx.json)
            : ;;
          *)
            echo "[assert] FAIL: sbom-ARTIFACT_OUTPUTS.uri must point at a .cdx.json under sboms/" >&2
            FAIL=1
            ;;
        esac

        case "${SBOM_AO_DIGEST}" in
          sha256:[0-9a-f]*)
            : ;;
          *)
            echo "[assert] FAIL: sbom-ARTIFACT_OUTPUTS.digest must be sha256:<hex>" >&2
            FAIL=1
            ;;
        esac

        if [ "${SBOM_AO_ISBUILDARTIFACT}" != "false" ]; then
          echo "[assert] FAIL: sbom-ARTIFACT_OUTPUTS.isBuildArtifact must be 'false' (SBOM is metadata, not product)" >&2
          FAIL=1
        fi

        if [ "${FAIL}" -ne 0 ]; then
          echo "[assert] one or more assertions failed" >&2
          exit 1
        fi
        echo "[assert] all Chains-valid Results present and well-formed"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: sbom-pkg-smoke-test
spec:
  description: |
    Three-Task pipeline:
      1. `seed`           — stage two deterministic .tar files into
                            the artifacts workspace.
      2. `generate-sbom`  — produce one CycloneDX SBOM per tarball,
                            emit the Chains-valid plural Results
                            (`IMAGES`, `SBOM_IMAGES`) plus the
                            byproduct object Result
                            (`sbom-ARTIFACT_OUTPUTS`).
      3. `assert-results` — verify each Result is shape-correct (one
                            IMAGES line + one SBOM_IMAGES line per
                            seeded artifact, all SBOM URLs end in
                            `.cdx.json@sha256:<hex>`, the byproduct
                            object carries `{uri, digest,
                            isBuildArtifact=false}`). Fails the
                            PipelineRun on any mismatch.

    See docs/provenance.md ("Per-build package SBOMs") for the
    walkthrough on extracting a specific package's SBOM from the
    Chains-signed attestation. The CONTAINER path
    (`cosign attach sbom`) is exercised separately by
    `pipelines/chains-smoke-test.yaml` + the `attach-sbom` Task.
  params:
    - name: artifact-glob
      type: string
      default: "*.tar"
      description: |
        Glob the generate-sbom Task evaluates against the artifacts
        workspace. Smoke seed produces .tar files; real package
        pipelines use `*.deb` or `*.rpm`.
    - name: syft-image
      type: string
      default: docker.io/anchore/syft:v1.18.0
    - name: tools-image
      type: string
      default: docker.io/library/busybox:1.36
  workspaces:
    - name: artifacts
      description: |
        Shared workspace where the seed Task drops .tar files and the
        generate-sbom Task reads from. emptyDir is fine for smoke;
        real pipelines bind the build-output PVC from `build-package`.
    - name: sboms
      description: |
        Shared workspace where per-artifact `<basename>.cdx.json`
        SBOMs are written. May be the same workspace as `artifacts`
        in real pipelines so publish-repo picks them up alongside the
        .deb / .rpm.
  tasks:
    - name: seed
      taskRef:
        name: sbom-pkg-smoke-seed
      workspaces:
        - name: artifacts
          workspace: artifacts
    - name: generate-sbom
      runAfter: [seed]
      taskRef:
        name: generate-sbom
      params:
        - name: artifact-glob
          value: $(params.artifact-glob)
        - name: syft-image
          value: $(params.syft-image)
        - name: tools-image
          value: $(params.tools-image)
        # Smoke runs offline — no S3 upload.
        - name: s3-bucket
          value: ""
      workspaces:
        - name: artifacts
          workspace: artifacts
        - name: sboms
          workspace: sboms
    - name: assert-results
      runAfter: [generate-sbom]
      taskRef:
        name: sbom-pkg-smoke-assert
      params:
        - name: images
          value: $(tasks.generate-sbom.results.IMAGES)
        - name: sbom-images
          value: $(tasks.generate-sbom.results.SBOM_IMAGES)
        - name: sbom-artifact-outputs-uri
          value: $(tasks.generate-sbom.results.sbom-ARTIFACT_OUTPUTS.uri)
        - name: sbom-artifact-outputs-digest
          value: $(tasks.generate-sbom.results.sbom-ARTIFACT_OUTPUTS.digest)
        - name: sbom-artifact-outputs-isbuildartifact
          value: $(tasks.generate-sbom.results.sbom-ARTIFACT_OUTPUTS.isBuildArtifact)
        - name: tools-image
          value: $(params.tools-image)
  results:
    # Re-expose the generate-sbom Task's Results at the Pipeline level
    # so a PipelineRun-level Chains attestation (deep-inspection
    # enabled or not) sees the same multi-subject grammar the TaskRun
    # exposes. IMAGES + SBOM_IMAGES are promoted to subjects;
    # `sbom-ARTIFACT_OUTPUTS` is promoted to a byproduct entry.
    - name: IMAGES
      description: |
        Newline-separated `<artifact-url>@sha256:<digest>` pairs, one
        per scanned artifact. Chains promotes each pair to a subject.
      value: $(tasks.generate-sbom.results.IMAGES)
    - name: SBOM_IMAGES
      description: |
        Newline-separated `<sbom-url>@sha256:<digest>` pairs, one per
        per-artifact SBOM file. Same Chains grammar; distinct Result
        name lets verifiers separate artifact subjects from SBOM
        subjects.
      value: $(tasks.generate-sbom.results.SBOM_IMAGES)
    - name: sbom-ARTIFACT_OUTPUTS-uri
      description: |
        `uri` field of the rollup SBOM byproduct descriptor (Chains-
        valid `*ARTIFACT_OUTPUTS` object Result).
      value: $(tasks.generate-sbom.results.sbom-ARTIFACT_OUTPUTS.uri)
    - name: sbom-ARTIFACT_OUTPUTS-digest
      description: |
        `digest` field of the rollup SBOM byproduct descriptor.
      value: $(tasks.generate-sbom.results.sbom-ARTIFACT_OUTPUTS.digest)
    - name: sbom-ARTIFACT_OUTPUTS-isBuildArtifact
      description: |
        `isBuildArtifact` field of the rollup SBOM byproduct
        descriptor. `"false"` — the SBOM is metadata about the build,
        not the build's product.
      value: $(tasks.generate-sbom.results.sbom-ARTIFACT_OUTPUTS.isBuildArtifact)

# generate-sbom — per-artifact CycloneDX SBOM Task.
#
# Runs `syft` against every artifact file matching a glob in a workspace
# (typically the build-output workspace produced by `build-package` —
# see issue #16), emits one CycloneDX-JSON SBOM per artifact, and
# surfaces a Chains-valid type-hint Result so the SBOM file's URI +
# digest are signed into the SLSA attestation Chains mints for the
# TaskRun.
#
# WHAT CHANGED IN #55 (vs. the original #50 shape):
#
#   The original Task declared three Result names that LOOKED like
#   Chains type-hints but aren't part of the Chains 0.26 grammar
#   (`SBOM_NAMES`, `SBOM_COUNT`, `SBOM_MEDIATYPE`) and shipped an
#   `ARTIFACT_OUTPUTS` value with a nested `sbom: {uri, digest,
#   mediaType}` block that Chains silently ignores. The valid Chains
#   0.26 output type-hint set is documented at
#     https://github.com/tektoncd/chains/blob/v0.26.0/docs/slsa-provenance.md#output-artifacts
#   and is limited to:
#     - *IMAGE_URL / *IMAGE_DIGEST
#     - IMAGES
#     - *ARTIFACT_URI / *ARTIFACT_DIGEST
#     - *ARTIFACT_OUTPUTS (object with `uri`, `digest`,
#       `isBuildArtifact` — no mediaType, no nested sbom)
#
#   So this Task now emits exactly:
#
#     - IMAGES — one `<artifact-url>@sha256:<digest>` line per scanned
#       artifact. Chains promotes each pair to a separate subject in
#       the SLSA attestation.
#
#     - SBOM_IMAGES — one `<sbom-url>@sha256:<digest>` line per
#       per-artifact SBOM file. This is the SAME `IMAGES`-shape Chains
#       grammar (Chains promotes each line to a subject too); the
#       distinct Result name lets downstream tooling tell artifacts
#       and SBOMs apart. The SBOM file lands in S3 at a stable
#       `<branch>/<sha>/<distro>/<arch>/sboms/<basename>.cdx.json`
#       prefix when the upload step runs.
#
#     - sbom-ARTIFACT_OUTPUTS — Chains-valid object Result (one
#       descriptor for the rollup SBOM file: `uri`, `digest`,
#       `isBuildArtifact: "false"`). Chains lifts this into
#       `predicate.runDetails.byproducts[]`. mediaType is NOT carried
#       in this shape — the file extension `.cdx.json` is the
#       mediaType signal, matching the caveat documented in
#       `pipelines/chains-smoke-test.yaml`'s `sbom` step.
#
#   The fully-typed SBOM attachment (mediaType embedded in the
#   attestation; OCI referrer; `cosign download sbom <image>` round-
#   trip) is provided for CONTAINER images by the sibling Task
#   `tasks/attach-sbom/task.yaml`, which runs `cosign attach sbom
#   --sbom <file> --type cyclonedx <image-ref>` after the image push.
#   Packages cannot use that path (no OCI registry); they keep the
#   S3-sibling + signed-byproduct convention this Task produces.
#
# WHY CYCLONEDX FOR PACKAGES (vs. SPDX for container images, #46):
#   - CycloneDX models dependency relationships (`dependencies[]`)
#     more naturally than SPDX does, and the dep-management ecosystem
#     (OWASP Dependency-Track, Snyk, GitHub Dependency Graph, Grype
#     with `--output cyclonedx-json`) consumes it more readily than
#     SPDX-JSON for *package* artefacts (.deb, .rpm) where the SBOM
#     is really a graph of installed shared libraries + bundled deps.
#   - The SPDX-for-images / CycloneDX-for-packages split is a
#     deliberate consumer-fit decision. See docs/provenance.md
#     ("Per-build package SBOMs") for the verifier-side walkthrough.
#
# FAILURE SEMANTICS:
#   The Task fails (exit non-zero) if syft can't produce a CycloneDX
#   SBOM for any matched artifact. Empty matches (`artifact-glob`
#   matches no files in the workspace) are a fatal misconfiguration —
#   emitting zero SBOMs silently would be worse than failing.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: generate-sbom
spec:
  description: |
    Scan every artifact under `artifact-glob` in the artifacts
    workspace with syft, emit one CycloneDX-JSON SBOM per artifact
    into the sboms workspace, optionally upload to S3, and emit the
    Chains-valid type-hint Results (`IMAGES`, `SBOM_IMAGES`, and the
    `sbom-ARTIFACT_OUTPUTS` byproduct object) so Chains signs the
    artifact + SBOM URIs + digests into the slsa/v2alpha4
    attestation. For CONTAINER images the fully-typed SBOM attachment
    is done by the sibling `attach-sbom` Task (cosign attach sbom);
    this Task is the package path (S3-sibling SBOM + signed
    byproduct).
  params:
    - name: artifact-glob
      type: string
      default: "*"
      description: |
        Shell glob (relative to the artifacts workspace root) matching
        the files to scan. Examples: `*.deb`, `*.rpm`, `**/*.deb`, or
        a bare `*` to scan everything. Each matched file produces one
        CycloneDX SBOM and one IMAGES/SBOM_IMAGES entry.
    - name: syft-image
      type: string
      default: docker.io/anchore/syft:v1.18.0
      description: |
        Pinned syft image. Bumping this is a deliberate supply-chain
        decision (same posture as the chains-smoke-test sbom step,
        pipelines/chains-smoke-test.yaml). v1.18.0 is the current
        stable line that emits CycloneDX 1.6 JSON cleanly and handles
        .deb / .rpm cataloguer outputs without warnings.
    - name: tools-image
      type: string
      default: docker.io/library/busybox:1.36
      description: |
        Pinned busybox image used by the emit-results step. Gives us
        /bin/sh, sha256sum, find, awk, sed, printf — everything
        needed to hash the SBOMs, iterate matches, and write Tekton
        Result files. Same pin as chains-smoke-test for build
        determinism.
    - name: uploader-image
      type: string
      default: docker.io/amazon/aws-cli:2.17.0
      description: |
        Pinned image with the AWS CLI for the optional S3 upload
        step. Skipped entirely when `s3-bucket` is empty (dev /
        smoke).
    - name: s3-bucket
      type: string
      default: ""
      description: |
        S3 bucket name to upload SBOMs to. Empty string disables
        upload (smoke runs offline; SBOMs remain in the sboms
        workspace and the per-artifact URLs in IMAGES / SBOM_IMAGES /
        sbom-ARTIFACT_OUTPUTS point at `workspace://...`).
    - name: s3-endpoint
      type: string
      default: ""
      description: |
        Optional S3 endpoint URL (for Sepia RGW or any local
        S3-compatible backend). Empty = AWS S3 default. Passed as
        `--endpoint-url`.
    - name: s3-branch
      type: string
      default: dev
      description: |
        Branch component of the S3 object key prefix. Real pipelines
        thread the actual git branch through; smoke uses `dev`.
    - name: s3-sha
      type: string
      default: smoke
      description: Commit SHA component of the S3 object key prefix.
    - name: s3-distro
      type: string
      default: smoke
      description: |
        Distro component of the S3 object key prefix
        (e.g. `centos10`, `jammy`). `smoke` for the standalone smoke
        test.
    - name: s3-arch
      type: string
      default: noarch
      description: |
        Arch component of the S3 object key prefix
        (e.g. `x86_64`, `aarch64`).
    - name: subject-prefix
      type: string
      default: ""
      description: |
        Optional URL prefix prepended to every artifact URL in IMAGES
        (and every SBOM URL in SBOM_IMAGES / sbom-ARTIFACT_OUTPUTS)
        so the Chains subjects identify the *published* artifact
        location rather than the workspace-local path. Example:
        `https://artifacts.ceph.com/ceph-artifacts-branch/main/<sha>/centos10/x86_64/`.
        Empty = URLs are `workspace://artifacts/<filename>` and
        `workspace://sboms/<filename>.cdx.json`.
  results:
    # ----------------------------------------------------------------
    # Chains-valid multi-subject type-hint grammar (Chains 0.26).
    #
    # Two declared plural Results, both shaped like Chains' `IMAGES`
    # grammar (newline-separated `<url>@sha256:<digest>` pairs).
    # Chains promotes each line in each Result to a subject in the
    # SLSA attestation it signs:
    #
    #   * IMAGES      — one line per scanned artifact (the .deb /
    #                   .rpm / .tar). Chains-grammar name; works on
    #                   every Chains version since 0.13.
    #   * SBOM_IMAGES — one line per per-artifact SBOM file. Same
    #                   shape (`<url>@sha256:<digest>`), distinct
    #                   Result name so verifier tooling can tell
    #                   artifacts and SBOMs apart on the attestation
    #                   subject list.
    #
    # Plus one Chains-valid `*ARTIFACT_OUTPUTS` byproduct object Result
    # for the rollup SBOM file:
    #
    #   * sbom-ARTIFACT_OUTPUTS — { uri, digest, isBuildArtifact }.
    #     `isBuildArtifact: "false"` lands the descriptor under
    #     `predicate.runDetails.byproducts[]` (not under subject) in
    #     the slsa/v2alpha4 attestation, matching the existing
    #     `sbom-ARTIFACT_OUTPUTS` shape from
    #     pipelines/chains-smoke-test.yaml. mediaType is NOT carried
    #     in this Result — Chains' object Result schema does not
    #     accept mediaType, and the `.cdx.json` filename extension is
    #     the mediaType signal. For containers, the
    #     `tasks/attach-sbom/task.yaml` Task additionally runs
    #     `cosign attach sbom --type cyclonedx` so verifiers can
    #     `cosign download sbom <image>` and recover the mediaType
    #     from the OCI referrer.
    # ----------------------------------------------------------------
    - name: IMAGES
      type: string
      description: |
        Newline-separated list of `<url>@sha256:<digest>` pairs, one
        per scanned artifact. Chains' multi-subject matcher promotes
        each pair to a subject in the SLSA attestation. The `<url>`
        is either `<subject-prefix>/<basename>` or
        `workspace://artifacts/<basename>` (smoke / no prefix).
    - name: SBOM_IMAGES
      type: string
      description: |
        Newline-separated list of `<sbom-url>@sha256:<digest>` pairs,
        one per per-artifact SBOM file. Same Chains-grammar shape as
        IMAGES; distinct Result name so downstream verifiers can
        separate artifact subjects from SBOM subjects. `<sbom-url>` is
        `<subject-prefix>/sboms/<basename>.cdx.json` when
        `subject-prefix` is set (matching the S3 layout the upload
        step writes), else `workspace://sboms/<basename>.cdx.json`.
    - name: sbom-ARTIFACT_OUTPUTS
      type: object
      properties:
        uri:    { type: string }
        digest: { type: string }
        isBuildArtifact: { type: string }
      description: |
        Chains-valid object Result describing the rollup SBOM file
        (`sbom.cdx.json`) as a build byproduct. Chains lifts this
        into `predicate.runDetails.byproducts[]` of the slsa/v2alpha4
        attestation. Shape is exactly what Chains 0.26 accepts:
        `{uri, digest, isBuildArtifact}` — no `mediaType`, no nested
        `sbom` block. `isBuildArtifact` is `"false"` because the SBOM
        is metadata about the build, not the build's product. Same
        shape as the `sbom-ARTIFACT_OUTPUTS` Result on
        `pipelines/chains-smoke-test.yaml`'s sbom step.
  workspaces:
    - name: artifacts
      description: |
        Workspace containing the build artifacts to scan. The
        `artifact-glob` param is evaluated relative to this workspace
        root. Mounted read-only is fine — syft only reads.
      mountPath: /workspace/artifacts
    - name: sboms
      description: |
        Workspace where one `<package>.cdx.json` is written per
        matched artifact, plus the `sbom.cdx.json` rollup. The same
        workspace must be readable by the emit-results and upload
        steps. In dev this is an emptyDir; in real pipelines it's
        commonly the same workspace as `artifacts` (deb/rpm + their
        SBOMs land side-by-side ready for publish-repo to pick up).
      mountPath: /workspace/sboms
    - name: s3-credentials
      description: |
        Optional. If mounted, expected to contain `AWS_ACCESS_KEY_ID`,
        `AWS_SECRET_ACCESS_KEY`, and optionally `AWS_SESSION_TOKEN`
        as files (one secret value per file). Same shape as the
        reproducibility-check Task uses.

        In Sepia the calling Pipeline leaves this workspace empty and
        instead binds a projected SA token; the uploader step then
        runs `aws sts assume-role-with-web-identity` to mint short-
        lived S3 creds (see docs/architecture.md
        "S3 credentials: STS OIDC via SA-token").

        In dev/smoke the workspace is empty AND `s3-bucket` is empty,
        so the upload step short-circuits and no creds are needed.
      optional: true
  steps:
    # ----------------------------------------------------------------
    # Step 1: scan — distroless `syft-image`, no shell.
    #
    # The anchore/syft image is distroless (gcr.io/distroless/static):
    # only the syft binary, no shell. We invoke syft directly via
    # `command:` + `args:` (same pattern as chains-smoke-test's sbom
    # step) and ask syft to emit a single rollup CycloneDX SBOM over
    # the entire artifacts workspace plus a syft-native JSON for the
    # emit-results step.
    #
    # WHY ONE ROLLUP, NOT N PER-ARTIFACT SCANS:
    # Tekton steps don't iterate, and the distroless syft image has
    # no shell to loop in. Splitting one SBOM N ways in the emit
    # step (hardlink the rollup file under each artifact's basename)
    # is what ships in v1 — every artifact gets correct
    # ARTIFACT_DIGEST + a SBOM_DIGEST that points at the *correct
    # CycloneDX bytes* covering its package content. For .deb / .rpm
    # the rollup IS a per-package decomposition (syft catalogues each
    # package separately inside one CycloneDX document); downstream
    # consumers grep by `metadata.component.name`.
    #
    # When richer per-artifact granularity is needed (one CycloneDX
    # scoped to one .deb), the follow-up is to swap the syft image
    # for a shell-capable variant (e.g. cgr.dev/chainguard/syft) and
    # add a per-artifact subprocess loop in step 2. The type-hint
    # Result grammar this Task emits doesn't change.
    # ----------------------------------------------------------------
    - name: scan
      image: $(params.syft-image)
      workingDir: /workspace/artifacts
      env:
        - name: SYFT_CHECK_FOR_APP_UPDATE
          value: "false"
      command: ["/syft"]
      args:
        - scan
        - "dir:/workspace/artifacts"
        - "--output"
        - "cyclonedx-json=/workspace/sboms/sbom.cdx.json"
        - "--output"
        # syft-native JSON carries source metadata + per-file catalog
        # entries used by the emit step.
        - "json=/workspace/sboms/syft-result.json"
        - "--quiet"
    - name: emit-results
      image: $(params.tools-image)
      workingDir: /workspace
      env:
        - name: ARTIFACT_GLOB
          value: $(params.artifact-glob)
        - name: SUBJECT_PREFIX
          value: $(params.subject-prefix)
      script: |
        #!/bin/sh
        set -eu

        ARTIFACTS_DIR="/workspace/artifacts"
        SBOMS_DIR="/workspace/sboms"
        ROLLUP_SBOM="${SBOMS_DIR}/sbom.cdx.json"

        if [ ! -f "${ROLLUP_SBOM}" ]; then
          echo "FATAL: expected ${ROLLUP_SBOM} from the scan step" >&2
          exit 1
        fi

        # Discover matched artifacts. The glob is expanded against the
        # artifacts workspace root. We change into it so basenames stay
        # clean for the Result names.
        cd "${ARTIFACTS_DIR}"

        # shellcheck disable=SC2086 -- glob expansion is the point.
        set +e
        MATCHES=$(ls -1 ${ARTIFACT_GLOB} 2>/dev/null | sort)
        set -e

        if [ -z "${MATCHES}" ]; then
          echo "FATAL: artifact-glob '${ARTIFACT_GLOB}' matched no files in ${ARTIFACTS_DIR}" >&2
          ls -la "${ARTIFACTS_DIR}" >&2 || true
          exit 1
        fi

        # Rollup SBOM digest — used for the per-artifact SBOM file
        # digests too (the per-artifact files are hardlinks /
        # copies of the rollup; see scan-step comment).
        ROLLUP_SHA="sha256:$(sha256sum "${ROLLUP_SBOM}" | awk '{print $1}')"

        IMAGES_FILE="$(results.IMAGES.path)"
        SBOM_IMAGES_FILE="$(results.SBOM_IMAGES.path)"
        : > "${IMAGES_FILE}"
        : > "${SBOM_IMAGES_FILE}"
        COUNT=0

        # Subject URL prefix for SBOM files. When `subject-prefix` is
        # set (real pipelines), the SBOMs live under `<prefix>/sboms/`
        # — matching the S3 layout the upload step writes. Otherwise
        # SBOMs surface as `workspace://sboms/...` (smoke / no upload).
        if [ -n "${SUBJECT_PREFIX}" ]; then
          SBOM_URL_PREFIX="${SUBJECT_PREFIX%/}/sboms"
        else
          SBOM_URL_PREFIX="workspace://sboms"
        fi

        for f in ${MATCHES}; do
          [ -f "${f}" ] || continue
          BASENAME=$(basename "${f}")

          ARTIFACT_SHA="sha256:$(sha256sum "${f}" | awk '{print $1}')"
          if [ -n "${SUBJECT_PREFIX}" ]; then
            ARTIFACT_URL="${SUBJECT_PREFIX%/}/${BASENAME}"
          else
            ARTIFACT_URL="workspace://artifacts/${BASENAME}"
          fi

          # Per-artifact SBOM file (a hardlink to the rollup keeps
          # disk use flat; busybox `ln` falls back to cp if hardlink
          # is not supported on the workspace FS).
          SBOM_FILE="${SBOMS_DIR}/${BASENAME}.cdx.json"
          rm -f "${SBOM_FILE}"
          ln "${ROLLUP_SBOM}" "${SBOM_FILE}" 2>/dev/null \
            || cp "${ROLLUP_SBOM}" "${SBOM_FILE}"
          SBOM_URL="${SBOM_URL_PREFIX}/${BASENAME}.cdx.json"

          # IMAGES Result: one `<artifact-url>@<digest>` line per artifact.
          printf '%s@%s\n' "${ARTIFACT_URL}" "${ARTIFACT_SHA}" >> "${IMAGES_FILE}"
          # SBOM_IMAGES Result: one `<sbom-url>@<digest>` line per SBOM
          # file. Same Chains grammar; distinct Result name lets
          # verifiers separate artifact subjects from SBOM subjects.
          printf '%s@%s\n' "${SBOM_URL}" "${ROLLUP_SHA}" >> "${SBOM_IMAGES_FILE}"

          COUNT=$((COUNT + 1))
          echo "[emit] artifact=${BASENAME}  sbom=${BASENAME}.cdx.json  digest=${ROLLUP_SHA}"
        done

        # sbom-ARTIFACT_OUTPUTS object Result — Chains-valid byproduct
        # descriptor for the rollup SBOM. Shape Chains 0.26 accepts:
        # `{uri, digest, isBuildArtifact}` — no mediaType, no nested
        # sbom block. Tekton parses object Results as JSON (not
        # key=value), and surfaces a TaskRunValidationFailed if the
        # declared `type: object` doesn't match the file contents.
        # Matches the same emit pattern as tasks/vuln-scan and
        # pipelines/chains-smoke-test (single-line JSON, printf-built
        # so we don't need jq in the busybox-flavoured tools image).
        ROLLUP_URL="${SBOM_URL_PREFIX}/sbom.cdx.json"
        printf '{"uri":"%s","digest":"%s","isBuildArtifact":"%s"}' \
          "${ROLLUP_URL}" "${ROLLUP_SHA}" "false" \
          > "$(results.sbom-ARTIFACT_OUTPUTS.path)"

        echo "[emit] IMAGES:"
        cat "${IMAGES_FILE}"
        echo "[emit] SBOM_IMAGES:"
        cat "${SBOM_IMAGES_FILE}"
        echo "[emit] sbom-ARTIFACT_OUTPUTS:"
        cat "$(results.sbom-ARTIFACT_OUTPUTS.path)"
        echo "[emit] scanned ${COUNT} artifact(s)"
        if [ "${COUNT}" -eq 0 ]; then
          echo "FATAL: zero artifacts scanned (glob matched files but none survived per-entry checks)" >&2
          exit 1
        fi

    # ----------------------------------------------------------------
    # Step 3 (optional): upload
    #
    # When `s3-bucket` is set, push every <basename>.cdx.json into
    #   s3://${S3_BUCKET}/${S3_BRANCH}/${S3_SHA}/${S3_DISTRO}/${S3_ARCH}/sboms/
    #
    # Credentials precedence (matches reproducibility-check):
    #   1. The `s3-credentials` workspace, if mounted, supplies static
    #      AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / optional
    #      AWS_SESSION_TOKEN files. This is the dev / smoke path.
    #
    #   2. If a projected SA token is mounted at
    #      /var/run/secrets/openshift/serviceaccount/token (Sepia
    #      production path), the step runs
    #      `aws sts assume-role-with-web-identity` to mint short-lived
    #      creds. AWS_ROLE_ARN must be set via the calling Pipeline.
    #      See docs/architecture.md "S3 credentials: STS OIDC via
    #      SA-token" and docs/provenance.md "Per-build package SBOMs".
    #
    #   3. If `s3-bucket` is empty, the step short-circuits and does
    #      nothing.
    # ----------------------------------------------------------------
    - name: upload
      image: $(params.uploader-image)
      workingDir: /workspace
      env:
        - name: S3_BUCKET
          value: $(params.s3-bucket)
        - name: S3_ENDPOINT
          value: $(params.s3-endpoint)
        - name: S3_BRANCH
          value: $(params.s3-branch)
        - name: S3_SHA
          value: $(params.s3-sha)
        - name: S3_DISTRO
          value: $(params.s3-distro)
        - name: S3_ARCH
          value: $(params.s3-arch)
      script: |
        #!/bin/sh
        set -eu

        if [ -z "${S3_BUCKET}" ]; then
          echo "[upload] s3-bucket empty; skipping upload (SBOMs remain in /workspace/sboms)"
          exit 0
        fi

        CRED_DIR="$(workspaces.s3-credentials.path)"
        if [ -d "${CRED_DIR}" ]; then
          for k in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            if [ -f "${CRED_DIR}/${k}" ]; then
              export "${k}=$(cat "${CRED_DIR}/${k}")"
            fi
          done
        fi

        # OIDC / projected-SA-token path. If AWS_ROLE_ARN is set AND
        # the SA token file is present, exchange it for short-lived
        # creds. The role's trust policy on RGW restricts which
        # buckets/prefixes it can write to.
        SA_TOKEN_FILE="${AWS_WEB_IDENTITY_TOKEN_FILE:-/var/run/secrets/openshift/serviceaccount/token}"
        if [ -z "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_ROLE_ARN:-}" ] && [ -f "${SA_TOKEN_FILE}" ]; then
          echo "[upload] minting STS creds via AssumeRoleWithWebIdentity (role=${AWS_ROLE_ARN})"
          ENDPOINT_ARG=""
          [ -n "${S3_ENDPOINT}" ] && ENDPOINT_ARG="--endpoint-url ${S3_ENDPOINT}"
          # shellcheck disable=SC2086
          CREDS_JSON=$(aws sts assume-role-with-web-identity \
            --role-arn "${AWS_ROLE_ARN}" \
            --role-session-name "tekton-generate-sbom" \
            --web-identity-token "$(cat "${SA_TOKEN_FILE}")" \
            ${ENDPOINT_ARG})
          export AWS_ACCESS_KEY_ID=$(echo "${CREDS_JSON}"     | sed -n 's/.*"AccessKeyId": *"\([^"]*\)".*/\1/p')
          export AWS_SECRET_ACCESS_KEY=$(echo "${CREDS_JSON}" | sed -n 's/.*"SecretAccessKey": *"\([^"]*\)".*/\1/p')
          export AWS_SESSION_TOKEN=$(echo "${CREDS_JSON}"     | sed -n 's/.*"SessionToken": *"\([^"]*\)".*/\1/p')
        fi

        KEY_PREFIX="${S3_BRANCH}/${S3_SHA}/${S3_DISTRO}/${S3_ARCH}/sboms"
        ENDPOINT_ARG=""
        [ -n "${S3_ENDPOINT}" ] && ENDPOINT_ARG="--endpoint-url ${S3_ENDPOINT}"

        UPLOADED=0
        for f in /workspace/sboms/*.cdx.json; do
          [ -f "${f}" ] || continue
          BN=$(basename "${f}")
          # shellcheck disable=SC2086
          aws s3 cp "${f}" "s3://${S3_BUCKET}/${KEY_PREFIX}/${BN}" ${ENDPOINT_ARG}
          UPLOADED=$((UPLOADED + 1))
        done
        echo "[upload] uploaded ${UPLOADED} SBOM(s) to s3://${S3_BUCKET}/${KEY_PREFIX}/"

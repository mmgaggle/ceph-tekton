# generate-sbom — per-artifact CycloneDX SBOM Task.
#
# Runs `syft` against every artifact file matching a glob in a workspace
# (typically the build-output workspace produced by `build-package` — see
# issue #16), emits one CycloneDX-JSON SBOM per artifact, and surfaces the
# per-artifact Tekton Chains type-hint Results so Chains attaches every
# (artifact, SBOM) pair to the slsa/v2alpha4 attestation it signs.
#
# Today this Task ships standalone. Once issue #16 lands, the
# package-build pipeline will declare:
#
#   tasks:
#     - name: build-package    # writes *.deb / *.rpm into the workspace
#       ...
#     - name: sbom
#       runAfter: [build-package]
#       taskRef: { name: generate-sbom }
#       workspaces:
#         - { name: artifacts, workspace: build-output }
#         - { name: sboms,     workspace: build-output }   # or a sibling PVC
#
# and the same Chains config that already observes container SBOMs (#46)
# picks up the per-package SBOMs without further wiring.
#
# WHY CYCLONEDX FOR PACKAGES (vs. SPDX for container images, #46):
#   - CycloneDX models dependency relationships (`dependencies[]`) more
#     naturally than SPDX does, and the dep-management ecosystem
#     (OWASP Dependency-Track, Snyk, GitHub Dependency Graph, Grype with
#     --output cyclonedx-json) consumes it more readily than SPDX-JSON
#     for *package* artefacts (.deb, .rpm) where the SBOM is really a
#     graph of installed shared libraries + bundled deps.
#   - Chains is format-agnostic: it copies `SBOM_MEDIATYPE` verbatim
#     into the resolvedDependencies descriptor. The SPDX-for-images /
#     CycloneDX-for-packages split is a deliberate consumer-fit
#     decision, NOT a Chains constraint. See docs/provenance.md
#     ("Per-build package SBOMs") for the verifier-side walkthrough.
#
# FAILURE SEMANTICS:
#   The Task fails (exit non-zero) if syft can't produce a CycloneDX SBOM
#   for any matched artifact. Empty matches (`artifact-glob` matches no
#   files in the workspace) are a fatal misconfiguration — emitting zero
#   SBOMs silently would be worse than failing.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: generate-sbom
spec:
  description: |
    Scan every artifact under `artifact-glob` in the artifacts workspace
    with syft, emit one CycloneDX-JSON SBOM per artifact into the sboms
    workspace, optionally upload to S3, and emit the Chains-grammar
    plural Results (`IMAGES`, `ARTIFACT_OUTPUTS`) Chains uses to attach
    each (artifact, SBOM) pair to the SLSA v2alpha4 attestation —
    plus contract-level index Results (`SBOM_NAMES`, `SBOM_COUNT`,
    `SBOM_MEDIATYPE`) for verifier tooling and dashboards.
  params:
    - name: artifact-glob
      type: string
      default: "*"
      description: |
        Shell glob (relative to the artifacts workspace root) matching the
        files to scan. Examples: `*.deb`, `*.rpm`, `**/*.deb`, or a bare
        `*` to scan everything. Each matched file produces one CycloneDX
        SBOM and one set of type-hinted Results.
    - name: syft-image
      type: string
      default: docker.io/anchore/syft:v1.18.0
      description: |
        Pinned syft image. Bumping this is a deliberate supply-chain
        decision (same posture as the chains-smoke-test sbom step,
        pipelines/chains-smoke-test.yaml). v1.18.0 is the current
        stable line that emits CycloneDX 1.6 JSON cleanly and handles
        .deb / .rpm cataloguer outputs without warnings.
    - name: tools-image
      type: string
      default: docker.io/library/busybox:1.36
      description: |
        Pinned busybox image used by the emit-results step. Gives us
        /bin/sh, sha256sum, find, awk, sed, printf — everything needed
        to hash the SBOMs, iterate matches, and write Tekton Result
        files. Same pin as chains-smoke-test for build determinism.
    - name: uploader-image
      type: string
      default: docker.io/amazon/aws-cli:2.17.0
      description: |
        Pinned image with the AWS CLI for the optional S3 upload step.
        Skipped entirely when `s3-bucket` is empty (dev / smoke).
    - name: s3-bucket
      type: string
      default: ""
      description: |
        S3 bucket name to upload SBOMs to. Empty string disables upload
        (smoke runs offline; SBOMs remain in the sboms workspace and the
        SBOM_URL Results point at `workspace://sboms/<name>.cdx.json`).
    - name: s3-endpoint
      type: string
      default: ""
      description: |
        Optional S3 endpoint URL (for Sepia RGW or any local
        S3-compatible backend). Empty = AWS S3 default. Passed as
        `--endpoint-url`.
    - name: s3-branch
      type: string
      default: dev
      description: |
        Branch component of the S3 object key prefix. Real pipelines
        thread the actual git branch through; smoke uses `dev`.
    - name: s3-sha
      type: string
      default: smoke
      description: Commit SHA component of the S3 object key prefix.
    - name: s3-distro
      type: string
      default: smoke
      description: |
        Distro component of the S3 object key prefix
        (e.g. `centos10`, `jammy`). `smoke` for the standalone smoke
        test.
    - name: s3-arch
      type: string
      default: noarch
      description: |
        Arch component of the S3 object key prefix
        (e.g. `x86_64`, `aarch64`).
    - name: subject-prefix
      type: string
      default: ""
      description: |
        Optional URL prefix prepended to every ARTIFACT_URL Result so
        the Chains subject identifies the *published* artifact location
        rather than the workspace-local path. Example:
        `https://artifacts.ceph.com/ceph-artifacts-branch/main/<sha>/centos10/x86_64/`.
        Empty = subject URL is `workspace://artifacts/<filename>`.
  results:
    # ----------------------------------------------------------------
    # Multi-subject Chains type-hint grammar.
    #
    # Per tektoncd/chains/docs/slsa-provenance.md, Chains supports two
    # equivalent ways to surface N (artifact, SBOM) pairs from a single
    # TaskRun:
    #
    #   (a) `ARTIFACT_OUTPUTS` — a single Result whose VALUE is a JSON
    #       array, one entry per artifact, each entry carrying its own
    #       `uri` / `digest` and an optional nested SBOM descriptor.
    #       This is the recommended pattern when the artifact list is
    #       only known at scan time (Tekton requires every Result to be
    #       declared in `spec.results`, so per-artifact discrete Result
    #       names with a runtime suffix don't work cleanly).
    #
    #   (b) `IMAGES` — a single Result whose VALUE is a list of
    #       `<url>@sha256:<digest>` pairs (one per line). Chains
    #       promotes each pair to a subject.  Pre-dates `ARTIFACT_OUTPUTS`
    #       and is kept for older Chains versions.
    #
    # We emit BOTH so:
    #   - `IMAGES` gives Chains' multi-subject promotion (works on every
    #     Chains version since 0.13).
    #   - `ARTIFACT_OUTPUTS` carries the SBOM descriptors (Chains 0.20+
    #     reads the nested `sbom` block and emits `resolvedDependencies`).
    #
    # The per-artifact `<NAME>_*` discrete-Result form mentioned in the
    # issue body is the *display* convention this Task targets; under
    # the hood Tekton's "all Results must be declared" rule means the
    # actual wire format is the two declared plural Results below.
    # Verifier-facing names + count are unchanged.
    # ----------------------------------------------------------------
    - name: IMAGES
      type: string
      description: |
        Newline-separated list of `<url>@sha256:<digest>` pairs, one
        per scanned artifact. Chains' multi-subject matcher promotes
        each pair to a subject in the SLSA attestation. The `<url>`
        is either `subject-prefix`/`<basename>` or
        `workspace://artifacts/<basename>` (smoke / no prefix).
    - name: ARTIFACT_OUTPUTS
      type: string
      description: |
        JSON array of per-artifact descriptors. Each entry has shape:
            {
              "name":   "<basename>",
              "uri":    "<artifact-url>",
              "digest": "sha256:<hex>",
              "sbom": {
                "uri":       "<sbom-url>",
                "digest":    "sha256:<hex>",
                "mediaType": "application/vnd.cyclonedx+json"
              }
            }
        Chains 0.20+ uses the nested `sbom` block to populate the
        attestation's `predicate.buildDefinition.resolvedDependencies[]`
        entry per artifact, so a verifier sees one SBOM descriptor per
        package without having to grep individual Result names.
    - name: SBOM_NAMES
      type: string
      description: |
        Newline-separated list of `<NAME>` slugs (one per artifact)
        derived from the artifact basename. Provided for downstream
        consumers and the smoke-test assert step; Chains itself reads
        `IMAGES` + `ARTIFACT_OUTPUTS`.
    - name: SBOM_COUNT
      type: string
      description: |
        Decimal count of (artifact, SBOM) pairs emitted. Smoke tests
        and dashboards use this as a sanity check (0 => bug or
        misconfigured artifact-glob — the Task fails in that case).
    - name: SBOM_MEDIATYPE
      type: string
      description: |
        application/vnd.cyclonedx+json — the CycloneDX-JSON media type
        applied to every per-artifact SBOM. Repeated per-artifact
        inside `ARTIFACT_OUTPUTS[].sbom.mediaType`, exposed once here
        as a contract-level Result.
  workspaces:
    - name: artifacts
      description: |
        Workspace containing the build artifacts to scan. The
        `artifact-glob` param is evaluated relative to this workspace
        root. Mounted read-only is fine — syft only reads.
      mountPath: /workspace/artifacts
    - name: sboms
      description: |
        Workspace where one `<package>.cdx.json` is written per matched
        artifact. The same workspace must be readable by the
        emit-results and upload steps. In dev this is an emptyDir;
        in real pipelines it's commonly the same workspace as
        `artifacts` (deb/rpm + their SBOMs land side-by-side ready for
        publish-repo to pick up).
      mountPath: /workspace/sboms
    - name: s3-credentials
      description: |
        Optional. If mounted, expected to contain `AWS_ACCESS_KEY_ID`,
        `AWS_SECRET_ACCESS_KEY`, and optionally `AWS_SESSION_TOKEN` as
        files (one secret value per file). Same shape as the
        reproducibility-check Task uses.

        In Sepia the calling Pipeline leaves this workspace empty and
        instead binds a projected SA token; the uploader step then
        runs `aws sts assume-role-with-web-identity` to mint short-
        lived S3 creds (see docs/architecture.md
        "S3 credentials: STS OIDC via SA-token").

        In dev/smoke the workspace is empty AND `s3-bucket` is empty,
        so the upload step short-circuits and no creds are needed.
      optional: true
  steps:
    # ----------------------------------------------------------------
    # Step 1: scan — distroless `syft-image`, no shell.
    #
    # The anchore/syft image is distroless (gcr.io/distroless/static):
    # only the syft binary, no shell. We invoke syft directly via
    # `command:` + `args:` (same pattern as chains-smoke-test's sbom
    # step) and ask syft to emit a single rollup CycloneDX SBOM over
    # the entire artifacts workspace plus a syft-native JSON for the
    # emit-results step.
    #
    # WHY ONE ROLLUP, NOT N PER-ARTIFACT SCANS:
    # Tekton steps don't iterate, and the distroless syft image has
    # no shell to loop in. Splitting one SBOM N ways in the emit
    # step (hardlink the rollup file under each artifact's basename)
    # is what ships in v1 — every artifact gets correct
    # ARTIFACT_DIGEST + a SBOM_DIGEST that points at the *correct
    # CycloneDX bytes* covering its package content. For .deb / .rpm
    # the rollup IS a per-package decomposition (syft catalogues each
    # package separately inside one CycloneDX document); downstream
    # consumers grep by `metadata.component.name`.
    #
    # When richer per-artifact granularity is needed (one CycloneDX
    # scoped to one .deb), the follow-up is to swap the syft image
    # for a shell-capable variant (e.g. cgr.dev/chainguard/syft) and
    # add a per-artifact subprocess loop in step 2. The type-hint
    # Result grammar this Task emits doesn't change.
    # ----------------------------------------------------------------
    - name: scan
      image: $(params.syft-image)
      workingDir: /workspace/artifacts
      env:
        - name: SYFT_CHECK_FOR_APP_UPDATE
          value: "false"
      command: ["/syft"]
      args:
        - scan
        - "dir:/workspace/artifacts"
        - "--output"
        - "cyclonedx-json=/workspace/sboms/sbom.cdx.json"
        - "--output"
        # syft-native JSON carries source metadata + per-file catalog
        # entries used by the emit step.
        - "json=/workspace/sboms/syft-result.json"
        - "--quiet"
    - name: emit-results
      image: $(params.tools-image)
      workingDir: /workspace
      env:
        - name: ARTIFACT_GLOB
          value: $(params.artifact-glob)
        - name: SUBJECT_PREFIX
          value: $(params.subject-prefix)
      script: |
        #!/bin/sh
        set -eu

        ARTIFACTS_DIR="/workspace/artifacts"
        SBOMS_DIR="/workspace/sboms"
        ROLLUP_SBOM="${SBOMS_DIR}/sbom.cdx.json"

        if [ ! -f "${ROLLUP_SBOM}" ]; then
          echo "FATAL: expected ${ROLLUP_SBOM} from the scan step" >&2
          exit 1
        fi

        # Discover matched artifacts. The glob is expanded against the
        # artifacts workspace root. We change into it so basenames stay
        # clean for the Result names.
        cd "${ARTIFACTS_DIR}"

        # shellcheck disable=SC2086 -- glob expansion is the point.
        set +e
        MATCHES=$(ls -1 ${ARTIFACT_GLOB} 2>/dev/null | sort)
        set -e

        if [ -z "${MATCHES}" ]; then
          echo "FATAL: artifact-glob '${ARTIFACT_GLOB}' matched no files in ${ARTIFACTS_DIR}" >&2
          ls -la "${ARTIFACTS_DIR}" >&2 || true
          exit 1
        fi

        # Compute the rollup SBOM's sha256 once — every per-artifact
        # SBOM_DIGEST points at the same bytes for v1 (see scan-step
        # comment). When we move to per-artifact syft invocations, this
        # is the only piece that changes.
        ROLLUP_SHA="sha256:$(sha256sum "${ROLLUP_SBOM}" | awk '{print $1}')"

        NAMES_FILE="$(results.SBOM_NAMES.path)"
        IMAGES_FILE="$(results.IMAGES.path)"
        OUTPUTS_FILE="$(results.ARTIFACT_OUTPUTS.path)"
        : > "${NAMES_FILE}"
        : > "${IMAGES_FILE}"
        COUNT=0
        FIRST=1

        # ARTIFACT_OUTPUTS is a JSON array. We build it incrementally
        # without jq (not in busybox) by tracking FIRST to skip the
        # leading comma. The shape Chains 0.20+ reads is:
        #
        #   [{ "name":..., "uri":..., "digest":...,
        #      "sbom": { "uri":..., "digest":..., "mediaType":... } }, ...]
        #
        # JSON-escaping is conservative: artifact basenames are
        # filesystem paths under our control (no quotes, no backslashes
        # in practice — package names use `[A-Za-z0-9._+-]`), so we
        # don't need a full shell JSON encoder.
        printf '[' > "${OUTPUTS_FILE}"

        for f in ${MATCHES}; do
          [ -f "${f}" ] || continue
          BASENAME=$(basename "${f}")
          # Display slug — uppercase, non-alnum -> _, `PKG_` prefix so
          # we always start with a letter. Used for SBOM_NAMES indexing
          # and the smoke-test assert step.
          SLUG=$(printf '%s' "${BASENAME}" \
            | tr '[:lower:]' '[:upper:]' \
            | sed 's/[^A-Z0-9]/_/g')
          NAME="PKG_${SLUG}"

          ARTIFACT_SHA="sha256:$(sha256sum "${f}" | awk '{print $1}')"
          if [ -n "${SUBJECT_PREFIX}" ]; then
            ARTIFACT_URL="${SUBJECT_PREFIX%/}/${BASENAME}"
          else
            ARTIFACT_URL="workspace://artifacts/${BASENAME}"
          fi

          # Per-artifact SBOM file (a hardlink to the rollup keeps
          # disk use flat; busybox `ln` falls back to cp if hardlink
          # is not supported on the workspace FS).
          SBOM_FILE="${SBOMS_DIR}/${BASENAME}.cdx.json"
          rm -f "${SBOM_FILE}"
          ln "${ROLLUP_SBOM}" "${SBOM_FILE}" 2>/dev/null \
            || cp "${ROLLUP_SBOM}" "${SBOM_FILE}"
          SBOM_URL="workspace://sboms/${BASENAME}.cdx.json"

          # IMAGES Result: one `<url>@<digest>` line per artifact.
          printf '%s@%s\n' "${ARTIFACT_URL}" "${ARTIFACT_SHA}" >> "${IMAGES_FILE}"

          # ARTIFACT_OUTPUTS Result: JSON array entry.
          if [ "${FIRST}" -eq 1 ]; then
            FIRST=0
          else
            printf ',' >> "${OUTPUTS_FILE}"
          fi
          printf '{"name":"%s","uri":"%s","digest":"%s","sbom":{"uri":"%s","digest":"%s","mediaType":"application/vnd.cyclonedx+json"}}' \
            "${BASENAME}" "${ARTIFACT_URL}" "${ARTIFACT_SHA}" \
            "${SBOM_URL}" "${ROLLUP_SHA}" \
            >> "${OUTPUTS_FILE}"

          echo "${NAME}" >> "${NAMES_FILE}"
          COUNT=$((COUNT + 1))
          echo "[emit] ${NAME}  artifact=${BASENAME}  sbom=${BASENAME}.cdx.json  digest=${ROLLUP_SHA}"
        done

        printf ']' >> "${OUTPUTS_FILE}"

        printf '%s' "${COUNT}"                       > "$(results.SBOM_COUNT.path)"
        printf '%s' "application/vnd.cyclonedx+json" > "$(results.SBOM_MEDIATYPE.path)"
        echo "[emit] SBOM_COUNT=${COUNT}"
        echo "[emit] SBOM_NAMES:"
        cat "${NAMES_FILE}"
        echo "[emit] IMAGES:"
        cat "${IMAGES_FILE}"
        echo "[emit] ARTIFACT_OUTPUTS:"
        cat "${OUTPUTS_FILE}"
        echo

    # ----------------------------------------------------------------
    # Step 3 (optional): upload
    #
    # When `s3-bucket` is set, push every <basename>.cdx.json into
    #   s3://${S3_BUCKET}/${S3_BRANCH}/${S3_SHA}/${S3_DISTRO}/${S3_ARCH}/sboms/
    #
    # Credentials precedence (matches reproducibility-check):
    #   1. The `s3-credentials` workspace, if mounted, supplies static
    #      AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / optional
    #      AWS_SESSION_TOKEN files. This is the dev / smoke path.
    #
    #   2. If a projected SA token is mounted at
    #      /var/run/secrets/openshift/serviceaccount/token (Sepia
    #      production path), the step runs
    #      `aws sts assume-role-with-web-identity` to mint short-lived
    #      creds. AWS_ROLE_ARN must be set via the calling Pipeline.
    #      See docs/architecture.md "S3 credentials: STS OIDC via
    #      SA-token" and docs/provenance.md "Per-build package SBOMs".
    #
    #   3. If `s3-bucket` is empty, the step short-circuits and does
    #      nothing.
    # ----------------------------------------------------------------
    - name: upload
      image: $(params.uploader-image)
      workingDir: /workspace
      env:
        - name: S3_BUCKET
          value: $(params.s3-bucket)
        - name: S3_ENDPOINT
          value: $(params.s3-endpoint)
        - name: S3_BRANCH
          value: $(params.s3-branch)
        - name: S3_SHA
          value: $(params.s3-sha)
        - name: S3_DISTRO
          value: $(params.s3-distro)
        - name: S3_ARCH
          value: $(params.s3-arch)
      script: |
        #!/bin/sh
        set -eu

        if [ -z "${S3_BUCKET}" ]; then
          echo "[upload] s3-bucket empty; skipping upload (SBOMs remain in /workspace/sboms)"
          exit 0
        fi

        CRED_DIR="$(workspaces.s3-credentials.path)"
        if [ -d "${CRED_DIR}" ]; then
          for k in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            if [ -f "${CRED_DIR}/${k}" ]; then
              export "${k}=$(cat "${CRED_DIR}/${k}")"
            fi
          done
        fi

        # OIDC / projected-SA-token path. If AWS_ROLE_ARN is set AND
        # the SA token file is present, exchange it for short-lived
        # creds. The role's trust policy on RGW restricts which
        # buckets/prefixes it can write to.
        SA_TOKEN_FILE="${AWS_WEB_IDENTITY_TOKEN_FILE:-/var/run/secrets/openshift/serviceaccount/token}"
        if [ -z "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_ROLE_ARN:-}" ] && [ -f "${SA_TOKEN_FILE}" ]; then
          echo "[upload] minting STS creds via AssumeRoleWithWebIdentity (role=${AWS_ROLE_ARN})"
          ENDPOINT_ARG=""
          [ -n "${S3_ENDPOINT}" ] && ENDPOINT_ARG="--endpoint-url ${S3_ENDPOINT}"
          # shellcheck disable=SC2086
          CREDS_JSON=$(aws sts assume-role-with-web-identity \
            --role-arn "${AWS_ROLE_ARN}" \
            --role-session-name "tekton-generate-sbom" \
            --web-identity-token "$(cat "${SA_TOKEN_FILE}")" \
            ${ENDPOINT_ARG})
          export AWS_ACCESS_KEY_ID=$(echo "${CREDS_JSON}"     | sed -n 's/.*"AccessKeyId": *"\([^"]*\)".*/\1/p')
          export AWS_SECRET_ACCESS_KEY=$(echo "${CREDS_JSON}" | sed -n 's/.*"SecretAccessKey": *"\([^"]*\)".*/\1/p')
          export AWS_SESSION_TOKEN=$(echo "${CREDS_JSON}"     | sed -n 's/.*"SessionToken": *"\([^"]*\)".*/\1/p')
        fi

        KEY_PREFIX="${S3_BRANCH}/${S3_SHA}/${S3_DISTRO}/${S3_ARCH}/sboms"
        ENDPOINT_ARG=""
        [ -n "${S3_ENDPOINT}" ] && ENDPOINT_ARG="--endpoint-url ${S3_ENDPOINT}"

        UPLOADED=0
        for f in /workspace/sboms/*.cdx.json; do
          [ -f "${f}" ] || continue
          BN=$(basename "${f}")
          # shellcheck disable=SC2086
          aws s3 cp "${f}" "s3://${S3_BUCKET}/${KEY_PREFIX}/${BN}" ${ENDPOINT_ARG}
          UPLOADED=$((UPLOADED + 1))
        done
        echo "[upload] uploaded ${UPLOADED} SBOM(s) to s3://${S3_BUCKET}/${KEY_PREFIX}/"

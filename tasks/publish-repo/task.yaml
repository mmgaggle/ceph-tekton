# publish-repo — repository-publish Task (DEB + RPM).
#
# Builds either a Debian-format apt repository (`mode=deb`, #20) or an
# RPM-format yum repository (`mode=rpm`, #19) from a workspace full of
# `.deb` or `.rpm` artefacts, signs the canonical repo-metadata file
# via Vault transit (key never leaves Vault), and uploads the signed
# metadata tree to a staging prefix in S3.
#
# The S3 prefix shape differs between modes to match the canonical
# layout each tool emits:
#
#   DEB: s3://${S3_BUCKET}/${S3_BRANCH}/${S3_SHA}-staging/${S3_DISTRO}/${S3_ARCH}/dists/${CODENAME}/
#   RPM: s3://${S3_BUCKET}/${S3_BRANCH}/${S3_SHA}-staging/${S3_DISTRO}/${S3_ARCH}/repodata/
#
# matching the S3 layouts the issue tracker calls out per variant
# (#20 AC and #19 AC respectively).
#
# SCOPE
# -----
# This Task ships both the `mode=deb` (reprepro) path (#20) and the
# `mode=rpm` (createrepo_c) path (#19). The dispatch step at the top
# of `steps:` selects which mode-specific build step runs; both modes
# converge on the same Vault-sign-then-upload scaffolding (steps
# write-sa-token / vault-login / sign-metadata / upload), parameterised
# by `mode` so the sign + upload steps know what file to sign and
# where to write it.
#
# WHAT REPREPRO DOES HERE
# -----------------------
# `reprepro` is the canonical apt-repository builder. Given a `conf/`
# directory describing one or more `Codename:` distributions and a
# bag of `.deb` files, it emits a Debian-format tree:
#
#   dists/<codename>/Release
#   dists/<codename>/InRelease           (cleartext-signed Release)
#   dists/<codename>/Release.gpg         (detached Release signature)
#   dists/<codename>/<component>/binary-<arch>/Packages
#   dists/<codename>/<component>/binary-<arch>/Packages.gz
#   pool/<component>/<initial>/<src>/<basename>.deb
#
# reprepro normally signs `Release` itself by shelling out to `gpg`
# with the key referenced in `SignWith:`. We cannot do that here
# because the GPG private key lives in Vault transit and never leaves
# Vault. Instead this Task runs reprepro WITHOUT a `SignWith:` field
# (reprepro emits unsigned `Release` + `Packages` + `Packages.gz`),
# then a follow-on step asks Vault to sign the `Release` file via the
# transit API and writes the two signed artefacts apt expects
# (`Release.gpg` and `InRelease`).
#
# WHAT CREATEREPO_C DOES HERE (mode=rpm)
# --------------------------------------
# `createrepo_c` is the canonical yum/dnf-repository builder. Given a
# directory containing `.rpm` files it emits a `repodata/` subtree:
#
#   <repo>/repodata/repomd.xml         metadata index (signed below)
#   <repo>/repodata/<hash>-primary.xml.gz
#   <repo>/repodata/<hash>-filelists.xml.gz
#   <repo>/repodata/<hash>-other.xml.gz
#   <repo>/<basename>.rpm              the original packages (copied/linked)
#
# yum/dnf clients verify `repomd.xml` against a detached OpenPGP
# signature at `repomd.xml.asc`; the per-package signatures inside
# each `.rpm` are a separate (build-time) concern and are not produced
# by this Task. createrepo_c does NOT sign anything itself; the sign
# step below produces `repomd.xml.asc` via Vault transit.
#
# VAULT TRANSIT FOR REPO SIGNING — WHAT'S REAL, WHAT'S STUBBED
# ------------------------------------------------------------
# Vault transit signs raw bytes with the configured key (`rsa-4096`
# for the real ceph repo signing key — see docs/vault.md "For the
# production GPG-signing flow"). It returns a Vault-native
# `vault:v<n>:<base64-sig>` string. apt-get / dnf on the consumer
# side require those bytes to be wrapped in an OpenPGP packet
# (RFC 4880) — a cleartext-signed framing (RFC 4880 §7) for the DEB
# `InRelease` file, and a detached OpenPGP signature packet for the
# DEB `Release.gpg` and the RPM `repomd.xml.asc`.
#
# For these tracers (#20 + #19) this Task does the Vault-side half
# end-to-end (k8s SA-token → vault login → transit/sign), and writes:
#
#   DEB Release.gpg     — the raw `vault:v<n>:<b64>` bytes returned
#                         by transit/sign of sha256(Release). NOT yet
#                         a valid OpenPGP detached signature; apt-get
#                         will reject it.
#
#   DEB InRelease       — same bytes wrapped in the RFC-4880-§7
#                         cleartext framing. Same caveat — the
#                         signature block itself is the raw vault
#                         token, not an OpenPGP packet.
#
#   RPM repomd.xml.asc  — the raw `vault:v<n>:<b64>` bytes returned
#                         by transit/sign of sha256(repomd.xml). NOT
#                         yet a valid OpenPGP detached signature;
#                         `gpg --verify` will reject it for the same
#                         reason `apt-get update` does on the DEB
#                         side. This is AC bullet 5 for #19 ("gpg
#                         --verify succeeds"); the OpenPGP packet
#                         wrapping is the same follow-up that AC
#                         bullet 4/5 for #20 calls out, and the only
#                         thing the sign step has to change is the
#                         bytes it emits — the filenames and S3 paths
#                         are already correct.
#
# This shape proves:
#   * reprepro / createrepo_c run and emit the expected tree
#   * the SA-token → k8s-auth → transit/sign chain works under the
#     same identity model as the existing vault-sign-smoke Task
#   * the resulting bytes land at the AC-specified S3 key prefix
#   * `gpg --verify` against an OpenPGP-wrapped signature is a
#     mechanical follow-up (tracked as the shared #20/#19 follow-up
#     once the packet-wrapping helper lands)
#
# The Task header is the contract: if you bump the Vault call to
# return wrapped OpenPGP packets, you can flip the two TODO markers
# below and AC bullet 4/5 start passing without changing the Task
# interface.
#
# OUTPUT LAYOUT
# -------------
# DEB (mode=deb):
#   /workspace/repo/conf/distributions          reprepro conf
#   /workspace/repo/dists/<codename>/Release    unsigned summary
#   /workspace/repo/dists/<codename>/Release.gpg detached sig (vault)
#   /workspace/repo/dists/<codename>/InRelease   cleartext-signed
#   /workspace/repo/pool/...                    .debs reprepro moved
#
# After the sign step the upload step `aws s3 cp --recursive`s the
# `dists/<codename>/` subtree into the staging prefix. The `pool/`
# tree is not uploaded by this Task in #20 — pool publication is the
# build-package Task's responsibility (#16); publish-repo only owns
# the metadata under `dists/`.
#
# RPM (mode=rpm):
#   /workspace/repo/<basename>.rpm              .rpms staged into the repo root
#   /workspace/repo/repodata/repomd.xml         metadata index (unsigned)
#   /workspace/repo/repodata/repomd.xml.asc     detached sig (vault)
#   /workspace/repo/repodata/<hash>-*.xml.gz    primary / filelists / other
#
# After the sign step the upload step `aws s3 cp --recursive`s ONLY
# the `repodata/` subtree into the staging prefix (matching #19 AC
# bullet 3 — the path is `.../repodata/`, not the repo root). The
# `.rpm` packages themselves are not uploaded by this Task; package
# publication is the build-package Task's responsibility (#16),
# same split as the DEB side.
#
# CREDENTIALS
# -----------
# Same dual-path pattern as `tasks/generate-sbom`, `tasks/make-check`,
# and `tasks/reproducibility-check`:
#
#   1. The `s3-credentials` workspace (dev / smoke) supplies static
#      `AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY` / optional
#      `AWS_SESSION_TOKEN` files.
#
#   2. In Sepia the workspace is left empty and a projected SA token
#      at /var/run/secrets/openshift/serviceaccount/token is exchanged
#      for short-lived RGW creds via
#      `aws sts assume-role-with-web-identity`. `AWS_ROLE_ARN` must
#      be set by the calling Pipeline.
#
# The Vault auth side uses the standard projected SA token
# (`/var/run/secrets/kubernetes.io/serviceaccount/token`) — same
# mechanism as `pipelines/tasks/vault-sign-smoke.yaml`. The calling
# Pipeline MUST run this Task with a ServiceAccount that's bound to
# the Vault role passed via `vault-role`.
#
# FAIL-CLOSED
# -----------
# The Task fails non-zero if:
#   * `mode` is not one of {deb, rpm}
#   * the artifacts workspace contains zero `.deb` files (mode=deb)
#     or zero `.rpm` files (mode=rpm)
#   * Vault is unreachable, returns an empty client_token, or refuses
#     the transit/sign call
#   * S3 upload of the signed metadata tree fails
# There is no path through this Task that publishes an unsigned
# `Release` (DEB) or `repomd.xml` (RPM) to S3.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: publish-repo
spec:
  description: |
    Build a Debian-format apt repository (mode=deb, reprepro) or an
    RPM-format yum repository (mode=rpm, createrepo_c) from artefacts
    in the artifacts workspace, sign the canonical metadata file via
    Vault transit, and upload the signed metadata subtree to a
    staging S3 prefix.

    DEB signs `dists/<codename>/Release`, emits `Release.gpg` +
    `InRelease`, uploads `dists/<codename>/`.

    RPM signs `repodata/repomd.xml`, emits `repomd.xml.asc`, uploads
    `repodata/`.
  params:
    - name: mode
      type: string
      default: "deb"
      description: |
        Repository format to publish. `deb` runs reprepro on `.deb`
        artefacts (#20). `rpm` runs createrepo_c on `.rpm` artefacts
        (#19). Any other value is fatal in the dispatch step.
    - name: codename
      type: string
      default: "noble"
      description: |
        DEB-only. Debian/Ubuntu codename for the `dists/<codename>/`
        subtree (e.g. `noble`, `jammy`, `bookworm`). reprepro's
        `conf/distributions` `Codename:` field. Must be a single
        codename — multi-suite publish (one Task per codename or a
        matrix fan-out) is the calling Pipeline's job (#22). Ignored
        when `mode=rpm` (createrepo_c has no codename concept; the
        per-distro split lives in the S3 prefix via `s3-distro`).
    - name: component
      type: string
      default: "main"
      description: |
        DEB-only. reprepro `Components:` field. `main` matches the
        upstream ceph apt repo layout. Ignored when `mode=rpm`.
    - name: architectures
      type: string
      default: "amd64"
      description: |
        DEB-only. Space-separated reprepro `Architectures:` list.
        `amd64` only for this tracer; the build-package matrix (#16)
        will thread `arm64` etc. through here. Ignored when
        `mode=rpm` — RPM repos are per-arch on the filesystem layer
        (the arch lives in the S3 prefix via `s3-arch`).
    - name: origin
      type: string
      default: "Ceph"
      description: |
        DEB-only. reprepro `Origin:` field on the published Release.
        Ignored when `mode=rpm`.
    - name: label
      type: string
      default: "Ceph"
      description: |
        DEB-only. reprepro `Label:` field on the published Release.
        Ignored when `mode=rpm`.
    - name: reprepro-image
      type: string
      default: "docker.io/library/ubuntu:noble"
      description: |
        Base image used by the DEB build-repo step. We install
        reprepro, gnupg, and ca-certificates at runtime (apt-get
        update + install). Pinning to ubuntu:noble matches the
        codename default and the build-builder-image matrix's
        ubuntu-noble entry, so the e2e cluster reuses an image
        layer that's already in cache.
    - name: createrepo-image
      type: string
      default: "quay.io/centos/centos:stream10"
      description: |
        Base image used by the RPM build-repo step. We install
        createrepo_c at runtime (dnf install). centos:stream10
        matches the centos10 default `s3-distro` and the rpm-family
        build-builder-image matrix entries (centos10, rocky10,
        fedora*); createrepo_c ships in stream10's default repos so
        no CRB / EPEL enable is required. Same docs-blessed base as
        docs/builder-images.md "RPM-family base image".
    - name: vault-image
      type: string
      default: "docker.io/hashicorp/vault:1.17.2"
      description: |
        Image providing the `vault` CLI for the sign step. Same pin
        as `pipelines/tasks/vault-sign-smoke.yaml`.
    - name: uploader-image
      type: string
      default: "docker.io/amazon/aws-cli:2.17.0"
      description: |
        Image providing the AWS CLI for the S3 upload step. Same pin
        as `tasks/generate-sbom/task.yaml`.
    - name: vault-addr
      type: string
      default: "http://vault.vault.svc.cluster.local:8200"
      description: In-cluster Vault API endpoint.
    - name: vault-role
      type: string
      default: "ceph-repo-signer"
      description: |
        Vault k8s-auth role bound to the (namespace,
        serviceaccount) running this Task. Must have `update` on
        `transit/sign/<transit-key>`. The dev cluster's role
        (`ceph-test-signer`, transit/sign/ceph-test-key) can be
        passed through for smoke; production overlays use the real
        `ceph-repo-signer` role + key.
    - name: transit-key
      type: string
      default: "ceph-repo-signing-key"
      description: |
        Vault transit key path component (`transit/sign/<this>`).
        In dev/smoke this can be overridden to `ceph-test-key`
        (the key hack/dev-vault-up.sh creates).
    - name: s3-bucket
      type: string
      default: ""
      description: |
        S3 bucket name to upload the signed `dists/<codename>/`
        tree into. Empty string disables upload (smoke runs
        offline; signed metadata stays in the repo workspace).
        Real pipelines pass `ceph-artifacts-dev` (matches
        terraform/environments/sepia/main.tf).
    - name: s3-endpoint
      type: string
      default: ""
      description: |
        Optional S3 endpoint URL (Sepia RGW or any S3-compatible
        backend). Empty = AWS S3 default.
    - name: s3-branch
      type: string
      default: "dev"
      description: |
        Branch component of the S3 key prefix. Real pipelines
        thread the actual git branch through; smoke uses `dev`.
    - name: s3-sha
      type: string
      default: "smoke"
      description: |
        Commit SHA component of the S3 key prefix. The published
        path is `<branch>/<sha>-staging/<distro>/<arch>/dists/...`
        per the issue tracker; the `-staging` suffix is appended
        automatically by the upload step (callers pass the bare
        SHA, NOT `<sha>-staging`).
    - name: s3-distro
      type: string
      default: "ubuntu-noble"
      description: |
        Distro component of the S3 key prefix
        (e.g. `ubuntu-noble`, `ubuntu-jammy`, `centos10`, `rocky10`).
        Real RPM pipelines pass `centos10` (matches #19 AC bullet 3).
    - name: s3-arch
      type: string
      default: "x86_64"
      description: |
        Arch component of the S3 key prefix (e.g. `x86_64`,
        `aarch64`). Note: this is the S3-LAYOUT arch
        (`x86_64`), distinct from reprepro's `Architectures:`
        list (`amd64`) — Debian and the Ceph S3 layout use
        different arch names and we don't conflate them.
  results:
    - name: REPO_URL
      type: string
      description: |
        Final S3 URL of the published signed-metadata directory —
        `dists/<codename>/` for DEB, `repodata/` for RPM. Empty
        when `s3-bucket` is unset (smoke / no-upload).
    - name: RELEASE_DIGEST
      type: string
      description: |
        `sha256:<hex>` of the (unsigned) canonical metadata file
        the sign step asked Vault to sign — `Release` for DEB,
        `repodata/repomd.xml` for RPM. Name is kept as
        `RELEASE_DIGEST` for DEB-side continuity; downstream
        verifiers cross-reference this against the Vault audit log
        entry for the transit/sign call.
  workspaces:
    - name: artifacts
      description: |
        Workspace containing `.deb` files (mode=deb) or `.rpm`
        files (mode=rpm) to import into the repo. The Task
        discovers them via `find … -name '*.deb'` /
        `find … -name '*.rpm'`, so subdirectory layout doesn't
        matter. In real pipelines this is the build-output
        workspace produced by build-package (#16); in smoke the
        e2e harness seeds a single tiny `.deb` / `.rpm`
        synthetically.
      mountPath: /workspace/artifacts
    - name: repo
      description: |
        Workspace where the mode-specific build step materialises
        the repo tree:
          DEB: `dists/`, `pool/`, `conf/` (reprepro)
          RPM: `repodata/` + flat `.rpm`s (createrepo_c)
        Must be writable across steps (build-repo writes; sign
        reads/writes the canonical metadata + its signature;
        upload reads). emptyDir is fine for smoke; real pipelines
        use a PVC so a follow-up `swap-staging-to-live` Task (#21)
        can see the same tree.
      mountPath: /workspace/repo
    - name: s3-credentials
      description: |
        Optional. If mounted, expected to contain `AWS_ACCESS_KEY_ID`,
        `AWS_SECRET_ACCESS_KEY`, and optionally `AWS_SESSION_TOKEN`
        as files (one secret value per file). Same shape as the
        reproducibility-check / generate-sbom Tasks.

        In Sepia the workspace is left empty and a projected SA
        token is exchanged for short-lived RGW creds via STS — same
        precedence as the other S3-uploading Tasks (see
        docs/architecture.md "S3 credentials: STS OIDC via
        SA-token").

        In dev/smoke the workspace is empty AND `s3-bucket` is
        empty, so the upload step short-circuits.
      optional: true
  # Shared in-memory scratch volume for the Vault-side handoff: the
  # `write-sa-token` step drops the projected SA JWT here, vault-login
  # writes the client_token, and the sign step reads both. Mirrors
  # the pattern in pipelines/tasks/vault-sign-smoke.yaml.
  volumes:
    - name: vault-scratch
      emptyDir:
        medium: Memory
  stepTemplate:
    volumeMounts:
      - name: vault-scratch
        mountPath: /vault-scratch
  steps:
    # ----------------------------------------------------------------
    # Step 0: dispatch on `mode`. Both `deb` and `rpm` fall through;
    # the mode-specific build-repo step (1a for deb, 1b for rpm)
    # no-ops when the mode doesn't match. An unrecognised mode is
    # fatal — silently no-op'ing would let a typo'd Pipeline produce
    # empty staging dirs.
    # ----------------------------------------------------------------
    - name: dispatch
      image: docker.io/library/busybox:1.36
      env:
        - name: MODE
          value: $(params.mode)
      script: |
        #!/bin/sh
        set -eu
        case "${MODE}" in
          deb)
            echo "[dispatch] mode=deb → reprepro path"
            ;;
          rpm)
            echo "[dispatch] mode=rpm → createrepo_c path"
            ;;
          *)
            echo "FATAL: unknown mode '${MODE}' — expected 'deb' or 'rpm'" >&2
            exit 1
            ;;
        esac

    # ----------------------------------------------------------------
    # Step 1a: build the apt repo with reprepro (mode=deb).
    #
    # Materialises `conf/distributions`, runs `reprepro includedeb`
    # against every `.deb` discovered in the artifacts workspace, and
    # produces an UNSIGNED `dists/<codename>/Release` (no `SignWith:`
    # field). The Vault sign step downstream wraps `Release` into the
    # `Release.gpg` + `InRelease` artefacts apt expects.
    #
    # No-ops when `mode!=deb`.
    # ----------------------------------------------------------------
    - name: build-repo-deb
      image: $(params.reprepro-image)
      workingDir: /workspace/repo
      env:
        - name: MODE
          value: $(params.mode)
        - name: CODENAME
          value: $(params.codename)
        - name: COMPONENT
          value: $(params.component)
        - name: ARCHITECTURES
          value: $(params.architectures)
        - name: ORIGIN
          value: $(params.origin)
        - name: LABEL
          value: $(params.label)
        - name: DEBIAN_FRONTEND
          value: noninteractive
      script: |
        #!/bin/bash
        set -euo pipefail

        if [ "${MODE}" != "deb" ]; then
          echo "[build-repo-deb] mode=${MODE} — skipping reprepro step"
          exit 0
        fi

        # The ubuntu:noble image is bare — install reprepro + gnupg
        # (gnupg pulls in the libraries reprepro links against even
        # though we don't sign here) + ca-certificates so apt over
        # https works in case the image's apt sources resolve to a
        # mirror that requires it.
        echo "[build-repo-deb] installing reprepro + gnupg..."
        apt-get update -qq
        apt-get install -y --no-install-recommends \
          reprepro gnupg ca-certificates >/dev/null
        reprepro --version

        # conf/distributions — single Codename:, single Component:,
        # whatever Architectures: were passed. No `SignWith:` because
        # signing is done by the sign step below using Vault transit
        # (reprepro's built-in SignWith: shells out to gpg with a
        # local secret key, which we can't have — the GPG key lives
        # in Vault).
        mkdir -p conf
        cat > conf/distributions <<EOF
        Origin: ${ORIGIN}
        Label: ${LABEL}
        Codename: ${CODENAME}
        Architectures: ${ARCHITECTURES}
        Components: ${COMPONENT}
        Description: Ceph apt repository (staging)
        EOF
        echo "[build-repo-deb] conf/distributions:"
        cat conf/distributions

        # Discover .debs. Empty match is fatal — publishing an empty
        # repo is never useful and is almost certainly a misconfigured
        # upstream build-package matrix.
        mapfile -t DEBS < <(find /workspace/artifacts -type f -name '*.deb' | sort)
        if [ "${#DEBS[@]}" -eq 0 ]; then
          echo "FATAL: no .deb files found under /workspace/artifacts" >&2
          ls -la /workspace/artifacts >&2 || true
          exit 1
        fi
        echo "[build-repo-deb] importing ${#DEBS[@]} .deb(s) into ${CODENAME}/${COMPONENT}:"
        for d in "${DEBS[@]}"; do
          echo "  - ${d}"
        done

        # `includedeb` is the per-deb import. reprepro deduplicates
        # by (package, version, arch) so re-runs against the same
        # input are idempotent.
        for d in "${DEBS[@]}"; do
          reprepro --basedir /workspace/repo \
                   --component "${COMPONENT}" \
                   includedeb "${CODENAME}" "${d}"
        done

        # Sanity check — the Release file must exist after `includedeb`
        # for the sign step to have something to sign.
        REL="/workspace/repo/dists/${CODENAME}/Release"
        if [ ! -s "${REL}" ]; then
          echo "FATAL: reprepro did not emit ${REL}" >&2
          find /workspace/repo -maxdepth 4 >&2 || true
          exit 1
        fi
        echo "[build-repo-deb] Release emitted ($(wc -c <"${REL}") bytes):"
        head -20 "${REL}"

    # ----------------------------------------------------------------
    # Step 1b: build the rpm repo with createrepo_c (mode=rpm).
    #
    # Stages every `.rpm` discovered in the artifacts workspace flat
    # under /workspace/repo/, then runs `createrepo_c .` which writes
    # `repodata/repomd.xml` + a handful of `<hash>-{primary,filelists,
    # other}.xml.gz` and `<hash>-{primary,filelists,other}.sqlite.*`
    # files into `repodata/`. The sign step downstream signs
    # `repodata/repomd.xml` via Vault transit and writes
    # `repodata/repomd.xml.asc`.
    #
    # No-ops when `mode!=rpm`.
    # ----------------------------------------------------------------
    - name: build-repo-rpm
      image: $(params.createrepo-image)
      workingDir: /workspace/repo
      env:
        - name: MODE
          value: $(params.mode)
      script: |
        #!/bin/bash
        set -euo pipefail

        if [ "${MODE}" != "rpm" ]; then
          echo "[build-repo-rpm] mode=${MODE} — skipping createrepo_c step"
          exit 0
        fi

        # centos:stream10 ships createrepo_c in the default repos
        # (AppStream); no CRB / EPEL enable needed. dnf is slow on a
        # cold image — `-q` keeps the log readable and `-y` skips
        # the prompt.
        echo "[build-repo-rpm] installing createrepo_c..."
        dnf install -y -q createrepo_c >/dev/null
        createrepo_c --version

        # Discover .rpms. Empty match is fatal — publishing an empty
        # repo is never useful and is almost certainly a misconfigured
        # upstream build-package matrix (mirrors the DEB branch).
        mapfile -t RPMS < <(find /workspace/artifacts -type f -name '*.rpm' | sort)
        if [ "${#RPMS[@]}" -eq 0 ]; then
          echo "FATAL: no .rpm files found under /workspace/artifacts" >&2
          ls -la /workspace/artifacts >&2 || true
          exit 1
        fi
        echo "[build-repo-rpm] staging ${#RPMS[@]} .rpm(s) into /workspace/repo:"
        for r in "${RPMS[@]}"; do
          echo "  - ${r}"
        done

        # Stage .rpms flat at the repo root. We `cp` rather than `mv`
        # to leave the artifacts workspace intact for any downstream
        # consumer (e.g. attach-sbom #55, vuln-scan, the eventual
        # build-package-side package upload). createrepo_c walks the
        # directory it's pointed at and writes repodata/ alongside
        # the packages.
        for r in "${RPMS[@]}"; do
          cp -f "${r}" /workspace/repo/
        done

        # createrepo_c writes `repodata/repomd.xml` + the per-section
        # `<hash>-*.xml.gz` files. `.` is intentional — pointing at
        # the cwd matches our staged-rpms-at-repo-root convention.
        # Re-running createrepo_c against the same dir is idempotent
        # (it rewrites repodata/ from scratch).
        createrepo_c .

        # Sanity check — repomd.xml must exist for the sign step.
        REPOMD="/workspace/repo/repodata/repomd.xml"
        if [ ! -s "${REPOMD}" ]; then
          echo "FATAL: createrepo_c did not emit ${REPOMD}" >&2
          find /workspace/repo -maxdepth 3 >&2 || true
          exit 1
        fi
        echo "[build-repo-rpm] repomd.xml emitted ($(wc -c <"${REPOMD}") bytes):"
        head -20 "${REPOMD}"
        echo "[build-repo-rpm] repodata/ contents:"
        ls -la /workspace/repo/repodata/

    # ----------------------------------------------------------------
    # Step 2: write the projected SA token into the shared scratch
    # volume so the Vault login step can present it. Same shape as
    # pipelines/tasks/vault-sign-smoke.yaml step 1.
    # ----------------------------------------------------------------
    - name: write-sa-token
      image: docker.io/library/busybox:1.36
      script: |
        #!/bin/sh
        set -eu
        TOKEN_PATH=/var/run/secrets/kubernetes.io/serviceaccount/token
        if [ ! -s "${TOKEN_PATH}" ]; then
          echo "FATAL: no SA token at ${TOKEN_PATH} — is this pod running with a real SA?" >&2
          exit 1
        fi
        cp "${TOKEN_PATH}" /vault-scratch/sa.jwt
        chmod 0400 /vault-scratch/sa.jwt
        echo "[sa-token] captured SA token ($(wc -c < /vault-scratch/sa.jwt) bytes)"

    # ----------------------------------------------------------------
    # Step 3: log in to Vault via the k8s auth method. Same shape as
    # pipelines/tasks/vault-sign-smoke.yaml step 2. The returned
    # client_token lands in /vault-scratch/client.token for the sign
    # step.
    # ----------------------------------------------------------------
    - name: vault-login
      image: $(params.vault-image)
      env:
        - name: VAULT_ADDR
          value: $(params.vault-addr)
      script: |
        #!/bin/sh
        set -eu
        SA_JWT="$(cat /vault-scratch/sa.jwt)"
        TOKEN=$(vault write -field=token \
                  auth/kubernetes/login \
                  role=$(params.vault-role) \
                  jwt="${SA_JWT}")
        if [ -z "${TOKEN}" ]; then
          echo "FATAL: vault login returned an empty client_token" >&2
          exit 1
        fi
        printf '%s' "${TOKEN}" > /vault-scratch/client.token
        chmod 0400 /vault-scratch/client.token
        echo "[vault-login] OK: vault login succeeded for role $(params.vault-role)"

    # ----------------------------------------------------------------
    # Step 4: sign the canonical repo-metadata file via Vault transit.
    #
    # DEB (mode=deb): signs `dists/<codename>/Release` and writes
    # `Release.gpg` + `InRelease` (RFC-4880-§7 cleartext framing).
    #
    # RPM (mode=rpm): signs `repodata/repomd.xml` and writes
    # `repodata/repomd.xml.asc` (detached signature, by-convention
    # filename yum/dnf clients look for).
    #
    # Vault transit signs the sha256 of the input bytes (base64
    # input) and returns `vault:v<n>:<b64>`. We write that string as
    # the canonical detached-signature file.
    #
    # TODO (#20 + #19 follow-up): the bytes Vault returns are not a
    # valid OpenPGP packet. The DEB AC bullets ("apt-get update works"
    # / "gpg --verify succeeds") and the RPM AC bullet 5 ("gpg
    # --verify succeeds against the signed repomd.xml") both require
    # wrapping the raw RSA signature in an OpenPGP signature packet
    # (RFC 4880 §5.2.3) before writing the .asc / .gpg files. The
    # Vault call site is the only thing that has to change — emit
    # packet-wrapped bytes here and the upload step downstream is
    # already correct. Tracked as a shared follow-up for both modes.
    # ----------------------------------------------------------------
    - name: sign-metadata
      image: $(params.vault-image)
      env:
        - name: VAULT_ADDR
          value: $(params.vault-addr)
        - name: MODE
          value: $(params.mode)
        - name: CODENAME
          value: $(params.codename)
        - name: TRANSIT_KEY
          value: $(params.transit-key)
      script: |
        #!/bin/sh
        set -eu
        VAULT_TOKEN="$(cat /vault-scratch/client.token)"
        export VAULT_TOKEN

        # Mode-specific input path. DEB signs dists/<codename>/Release,
        # RPM signs repodata/repomd.xml; the dispatch step has already
        # rejected anything other than {deb,rpm}.
        case "${MODE}" in
          deb)
            INPUT_FILE="/workspace/repo/dists/${CODENAME}/Release"
            HUMAN_NAME="Release"
            ;;
          rpm)
            INPUT_FILE="/workspace/repo/repodata/repomd.xml"
            HUMAN_NAME="repomd.xml"
            ;;
          *)
            echo "FATAL: unexpected mode '${MODE}' in sign-metadata (dispatch step bug)" >&2
            exit 1
            ;;
        esac

        if [ ! -s "${INPUT_FILE}" ]; then
          echo "FATAL: ${INPUT_FILE} missing or empty — did the mode=${MODE} build-repo step run?" >&2
          exit 1
        fi

        # Base64-encode the input contents for the transit/sign
        # input field. The vault CLI does not chunk input on stdin,
        # so we keep it inline — Release / repomd.xml are O(few KB)
        # even for large repos.
        PAYLOAD_B64=$(base64 -w0 < "${INPUT_FILE}")
        echo "[sign] signing $(wc -c <"${INPUT_FILE}") bytes of ${HUMAN_NAME} via transit/${TRANSIT_KEY}"

        SIG=$(vault write -field=signature \
                "transit/sign/${TRANSIT_KEY}" \
                input="${PAYLOAD_B64}")
        case "${SIG}" in
          vault:v*:*)
            echo "[sign] OK: transit signature shape valid"
            ;;
          *)
            echo "FATAL: transit/sign returned unexpected shape: ${SIG}" >&2
            exit 1
            ;;
        esac

        # Belt-and-suspenders: round-trip through transit/verify so
        # we catch a silent key-version mismatch before we publish.
        VERIFIED=$(vault write -field=valid \
                     "transit/verify/${TRANSIT_KEY}" \
                     input="${PAYLOAD_B64}" \
                     signature="${SIG}")
        if [ "${VERIFIED}" != "true" ]; then
          echo "FATAL: vault could not verify the signature it just produced" >&2
          exit 1
        fi
        echo "[sign] OK: transit/verify accepted the signature"

        # Write the mode-specific detached-signature file(s).
        case "${MODE}" in
          deb)
            # Release.gpg — detached signature. TODO follow-up:
            # wrap the raw RSA signature in an OpenPGP packet so
            # apt-get accepts this. Today this is the raw vault:
            # token, written so the upload-side and reviewer can
            # see the publish-path is wired through.
            printf '%s\n' "${SIG}" > "/workspace/repo/dists/${CODENAME}/Release.gpg"

            # InRelease — cleartext-signed Release. Same TODO as
            # Release.gpg: the signature block inside the framing
            # is the raw vault: token rather than an OpenPGP packet.
            # The framing itself is correct so the file shape is
            # recognisable.
            {
              printf -- '-----BEGIN PGP SIGNED MESSAGE-----\n'
              printf 'Hash: SHA256\n\n'
              cat "${INPUT_FILE}"
              printf -- '-----BEGIN PGP SIGNATURE-----\n\n'
              printf '%s\n' "${SIG}"
              printf -- '-----END PGP SIGNATURE-----\n'
            } > "/workspace/repo/dists/${CODENAME}/InRelease"

            echo "[sign] wrote Release.gpg + InRelease:"
            ls -la "/workspace/repo/dists/${CODENAME}/" \
              | grep -E 'Release(.gpg|$)|InRelease' || true
            ;;
          rpm)
            # repodata/repomd.xml.asc — detached signature. yum/dnf
            # clients fetch this filename by convention (the
            # `gpgkey=` / `repo_gpgcheck=1` configuration tells the
            # client to verify it against the imported public key).
            # TODO follow-up: same OpenPGP-packet wrapping caveat as
            # the DEB Release.gpg above — the raw vault: token is
            # written so the publish chain is observable end-to-end,
            # but `gpg --verify repomd.xml.asc repomd.xml` will not
            # accept it until the wrapping helper lands. AC bullet 5
            # of #19 lives or dies on that follow-up.
            printf '%s\n' "${SIG}" > "/workspace/repo/repodata/repomd.xml.asc"

            echo "[sign] wrote repodata/repomd.xml.asc:"
            ls -la "/workspace/repo/repodata/" \
              | grep -E 'repomd\.xml(\.asc)?$' || true
            ;;
        esac

        # RELEASE_DIGEST result — sha256 of the (unsigned) signed-
        # input file (Release for DEB, repomd.xml for RPM). The
        # result name keeps "RELEASE" for back-compat with the DEB
        # side; downstream verifiers cross-reference this against
        # the Vault audit log entry for the transit/sign call.
        REL_SHA="sha256:$(sha256sum "${INPUT_FILE}" | awk '{print $1}')"
        printf '%s' "${REL_SHA}" > "$(results.RELEASE_DIGEST.path)"
        echo "[sign] RELEASE_DIGEST=${REL_SHA}"

    # ----------------------------------------------------------------
    # Step 5: upload the signed-metadata subtree to S3.
    #
    # Output path matches each variant's AC:
    #   DEB: s3://${S3_BUCKET}/${S3_BRANCH}/${S3_SHA}-staging/${S3_DISTRO}/${S3_ARCH}/dists/${CODENAME}/
    #   RPM: s3://${S3_BUCKET}/${S3_BRANCH}/${S3_SHA}-staging/${S3_DISTRO}/${S3_ARCH}/repodata/
    #
    # Callers pass the bare SHA in `s3-sha`; this step appends the
    # `-staging` suffix so a future swap-to-live Task (#21) only has
    # to rewrite that one segment.
    #
    # Same credentials precedence as tasks/generate-sbom +
    # tasks/make-check: workspace-mounted static creds first,
    # AWS_ROLE_ARN + projected SA token (STS AssumeRoleWithWebIdentity)
    # second, no-op if s3-bucket is empty.
    # ----------------------------------------------------------------
    - name: upload
      image: $(params.uploader-image)
      workingDir: /workspace/repo
      env:
        - name: MODE
          value: $(params.mode)
        - name: S3_BUCKET
          value: $(params.s3-bucket)
        - name: S3_ENDPOINT
          value: $(params.s3-endpoint)
        - name: S3_BRANCH
          value: $(params.s3-branch)
        - name: S3_SHA
          value: $(params.s3-sha)
        - name: S3_DISTRO
          value: $(params.s3-distro)
        - name: S3_ARCH
          value: $(params.s3-arch)
        - name: CODENAME
          value: $(params.codename)
      script: |
        #!/bin/sh
        set -eu

        if [ -z "${S3_BUCKET}" ]; then
          echo "[upload] s3-bucket empty; skipping upload (smoke / no-upload run)"
          # Emit an empty REPO_URL result so downstream Pipelines
          # never see a nil result reference.
          printf '' > "$(results.REPO_URL.path)"
          exit 0
        fi

        # Credentials precedence (matches tasks/generate-sbom):
        # 1. Static creds from the s3-credentials workspace, if mounted.
        CRED_DIR="$(workspaces.s3-credentials.path)"
        if [ -d "${CRED_DIR}" ]; then
          for k in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            if [ -f "${CRED_DIR}/${k}" ]; then
              export "${k}=$(cat "${CRED_DIR}/${k}")"
            fi
          done
        fi

        # 2. STS AssumeRoleWithWebIdentity (Sepia / production path).
        SA_TOKEN_FILE="${AWS_WEB_IDENTITY_TOKEN_FILE:-/var/run/secrets/openshift/serviceaccount/token}"
        if [ -z "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_ROLE_ARN:-}" ] && [ -f "${SA_TOKEN_FILE}" ]; then
          echo "[upload] minting STS creds via AssumeRoleWithWebIdentity (role=${AWS_ROLE_ARN})"
          ENDPOINT_ARG=""
          [ -n "${S3_ENDPOINT}" ] && ENDPOINT_ARG="--endpoint-url ${S3_ENDPOINT}"
          # shellcheck disable=SC2086
          CREDS_JSON=$(aws sts assume-role-with-web-identity \
            --role-arn "${AWS_ROLE_ARN}" \
            --role-session-name "tekton-publish-repo" \
            --web-identity-token "$(cat "${SA_TOKEN_FILE}")" \
            ${ENDPOINT_ARG})
          export AWS_ACCESS_KEY_ID=$(echo "${CREDS_JSON}"     | sed -n 's/.*"AccessKeyId": *"\([^"]*\)".*/\1/p')
          export AWS_SECRET_ACCESS_KEY=$(echo "${CREDS_JSON}" | sed -n 's/.*"SecretAccessKey": *"\([^"]*\)".*/\1/p')
          export AWS_SESSION_TOKEN=$(echo "${CREDS_JSON}"     | sed -n 's/.*"SessionToken": *"\([^"]*\)".*/\1/p')
        fi

        if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
          echo "FATAL: no S3 credentials available (no s3-credentials workspace, no STS path)" >&2
          exit 1
        fi

        # Per-issue path. DEB uses `dists/<codename>/` (#20 AC), RPM
        # uses `repodata/` (#19 AC bullet 3). The dispatch step has
        # already rejected anything other than {deb,rpm}.
        case "${MODE}" in
          deb)
            KEY_PREFIX="${S3_BRANCH}/${S3_SHA}-staging/${S3_DISTRO}/${S3_ARCH}/dists/${CODENAME}"
            SRC="/workspace/repo/dists/${CODENAME}/"
            ;;
          rpm)
            KEY_PREFIX="${S3_BRANCH}/${S3_SHA}-staging/${S3_DISTRO}/${S3_ARCH}/repodata"
            SRC="/workspace/repo/repodata/"
            ;;
          *)
            echo "FATAL: unexpected mode '${MODE}' in upload step (dispatch step bug)" >&2
            exit 1
            ;;
        esac
        DEST="s3://${S3_BUCKET}/${KEY_PREFIX}/"

        ENDPOINT_ARG=""
        [ -n "${S3_ENDPOINT}" ] && ENDPOINT_ARG="--endpoint-url ${S3_ENDPOINT}"

        echo "[upload] uploading ${SRC} → ${DEST}"
        # shellcheck disable=SC2086
        aws s3 cp --recursive "${SRC}" "${DEST}" ${ENDPOINT_ARG}

        printf '%s' "${DEST}" > "$(results.REPO_URL.path)"
        echo "[upload] REPO_URL=${DEST}"

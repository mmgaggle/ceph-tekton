# ServiceAccount the `build-builder-image-matrix-nightly` CronJob's
# pod runs under.
#
# What this SA does:
#   The CronJob's pod runs `kubectl create -f -` against a
#   PipelineRun manifest piped in via heredoc. That apply needs RBAC
#   to create PipelineRuns in the `build-builder-image` namespace.
#   See role.yaml for the exact verbs granted.
#
# What this SA does NOT do:
#   The PipelineRun itself runs under a DIFFERENT ServiceAccount
#   with broader rights (workspace PVC mount, in-cluster registry
#   push via image-pusher SA token, Chains signing-key access for
#   the per-cell attestation). That SA is configured by the broader
#   Sepia overlay alongside the registry RoleBinding + the Chains
#   signing-key Secret. It is intentionally NOT in this base.
#
# Naming: matches the `serviceAccountName: build-builder-image-cron`
# field in `pipelines/build-builder-image-matrix-nightly.yaml`'s
# CronJob spec.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-builder-image-cron
  namespace: build-builder-image
  labels:
    app.kubernetes.io/name: build-builder-image
    app.kubernetes.io/component: cron-submitter
    app.kubernetes.io/part-of: ceph-tekton

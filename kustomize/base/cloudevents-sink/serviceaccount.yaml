# ServiceAccount the cloudevents-sink Deployment runs under (issue #63).
#
# What this SA does:
#   - Acts as the WORKLOAD identity for the sink pod. The pod itself
#     needs no in-cluster Kubernetes API access; the Role bound to
#     this SA is empty by design (see role.yaml).
#   - Is the SUBJECT of the projected SA token used for
#     AssumeRoleWithWebIdentity against RGW. The Sepia overlay
#     attaches a projected-token volume + sets AWS_ROLE_ARN on the
#     Deployment so boto3 mints short-lived S3 creds for the
#     `ceph-tekton-events` RGW role.
#
# WHY a dedicated SA (not `default`):
#   The RGW OIDC trust policy binds to a specific (namespace, SA)
#   pair. Using a named SA pins the trust path and stops a future
#   "everything runs as default" footgun from accidentally granting
#   the same S3 write rights to unrelated workloads landing in this
#   namespace.
#
# Naming: matches `serviceAccountName: cloudevents-sink` on the
# Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudevents-sink
  namespace: cloudevents-sink
  labels:
    app.kubernetes.io/name: cloudevents-sink
    app.kubernetes.io/part-of: ceph-tekton

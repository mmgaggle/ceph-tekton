# S3 access credentials the zgw-posix Pod uses on startup. Defaults
# match `hack/verify-s3-module.sh` (cephtekton / cephtekton) so a
# contributor's mental model is unified between the standalone-podman
# verify flow and the in-cluster flow.
#
# DO NOT use this Secret on a shared or production cluster. The plain
# stringData values are literal — there is no rotation, no projection,
# no Vault round-trip. zgw-posix on dev is "the cluster's own RGW
# stand-in", not a security boundary.
#
# Downstream Tasks read these via envFrom on this Secret. Overlays
# (kustomize/overlays/dev-local/) MAY patch this Secret's stringData
# to inject contributor-specific keys; the in-tree default is the
# documented dev posture.
apiVersion: v1
kind: Secret
metadata:
  name: zgw-posix-credentials
  namespace: zgw-posix
  labels:
    app.kubernetes.io/name: zgw-posix
    app.kubernetes.io/part-of: ceph-tekton
type: Opaque
stringData:
  # The zgw-posix image's exact env-var shape is upstream-controlled.
  # `hack/verify-s3-module.sh` uses these two names against the same
  # image; we re-use them here so the contract matches.
  RGW_ACCESS_KEY: cephtekton
  RGW_SECRET_KEY: cephtekton
  # AWS SDK conventions — Tasks consuming the in-cluster endpoint can
  # mount this Secret with envFrom and get both naming schemes for
  # free, so neither convention needs a translation step.
  AWS_ACCESS_KEY_ID: cephtekton
  AWS_SECRET_ACCESS_KEY: cephtekton

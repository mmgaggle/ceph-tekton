# PVC backing the POSIX filesystem the zgw-posix RGW driver writes
# objects into. Bound by whatever default StorageClass the cluster
# has — kind 0.24+ ships it as `standard` (backed by the
# local-path-provisioner), older kind builds shipped it as
# `local-path`, OpenShift typically has its own. Don't pin a
# specific name here; downstream overlays can strategic-merge a
# storageClassName if they need to target a non-default SC.
#
# Size: 10Gi covers the dev case comfortably — the Ceph artifact set
# in the dev terraform env is small ( < 100MB of test objects across
# the four buckets), and zgw-posix's POSIX layout doesn't multiply
# the overhead the way bluestore would on a real RGW.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zgw-posix-data
  namespace: zgw-posix
  labels:
    app.kubernetes.io/name: zgw-posix
    app.kubernetes.io/part-of: ceph-tekton
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

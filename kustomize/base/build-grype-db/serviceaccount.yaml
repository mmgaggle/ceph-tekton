# ServiceAccount the `build-grype-db-cron` CronJob's pod runs under.
#
# What this SA does:
#   The CronJob's pod runs `kubectl create -f -` against a PipelineRun
#   manifest piped in via heredoc. That apply needs RBAC to create the
#   PipelineRun in the `build-grype-db` namespace. See role.yaml for
#   the exact verbs granted.
#
# What this SA does NOT do:
#   The PipelineRun itself runs under a DIFFERENT ServiceAccount with
#   broader rights (workspace mounts, Chains signing-key access, S3
#   STS via projected SA token). That SA is configured by the broader
#   Sepia overlay alongside the cosign-signing-key Secret + the
#   STS-OIDC IAM role binding. It is intentionally NOT in this base.
#
# Naming: matches the `serviceAccountName: build-grype-db-cron` field
# in pipelines/build-grype-db.yaml's CronJob spec.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-grype-db-cron
  namespace: build-grype-db
  labels:
    app.kubernetes.io/name: build-grype-db
    app.kubernetes.io/component: cron-submitter
    app.kubernetes.io/part-of: ceph-tekton

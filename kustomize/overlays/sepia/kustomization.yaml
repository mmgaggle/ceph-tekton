apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# sepia overlay — Sepia OpenShift target.
#
# Distinguishing posture vs dev-{local,kind}:
#   - NO zgw-posix base. Sepia colocates real Ceph RGW with the
#     OpenShift cluster; Pipelines reach S3 via the real endpoint, not
#     the dev approximation. Wiring zgw-posix here would just produce
#     dead manifests + confuse operators reading the namespace list.
#   - Tekton bundle: this overlay's eventual posture is the OpenShift
#     Pipelines operator (which manages Tekton + PaC + Chains as a
#     supported bundle). For phase-1 alignment with the dev overlays
#     we currently still pull the same `kustomize/base/tekton-pipelines/`
#     manifest — that line is expected to be replaced by an
#     openshift-pipelines Subscription/Operator stanza in a follow-up
#     PR (tracked in PLAN.md "Bootstrap & cluster install"). Leave
#     the line in place for now so this overlay renders successfully
#     in `make kustomize-validate`.
#   - build-grype-db RBAC is identical to the dev path. The PipelineRun
#     EXECUTOR SA (cosign-signing-key + S3 STS via projected SA token)
#     is a separate Sepia-only object that lives in its own follow-up;
#     see kustomize/base/build-grype-db/serviceaccount.yaml's comment.
#   - build-builder-image RBAC follows the same convention as
#     build-grype-db: cron-submitter SA + Role + RoleBinding for the
#     nightly CronJob (issue #12). The PipelineRun executor SA
#     (in-cluster registry pusher token + Chains signing key) is a
#     separate Sepia-only follow-up.
#   - chains-config overrides (fulcio/keyless, OCI artifact storage,
#     OIDC issuer URL) ALSO land here in a follow-up — same overlay,
#     separate PR — per kustomize/base/tekton-chains/chains-config.patch.yaml.
#
# Resource ordering: Tekton first so its CRDs land before the
# build-grype-db and build-builder-image Roles name them. The
# TektonConfig CR (tektonconfig-pruner.yaml, issue #60 + #63) is
# reconciled by the OpenShift Pipelines operator — it's only
# meaningful on Sepia (the operator is not installed in the
# dev-{local,kind} overlays, which run raw Tekton Pipelines from
# release.yaml), so it lives in this overlay rather than the
# shared base.
#
# cloudevents-sink (issue #63) MUST be in the resource list BEFORE
# tektonconfig-pruner.yaml. The TektonConfig flips
# `send-cloudevents-for-runs: true` and points the controller at
# `http://cloudevents-sink.cloudevents-sink.svc.cluster.local`;
# enabling that flag against a Service that does not yet resolve
# makes the Tekton controller log a DNS-lookup error once per
# PipelineRun lifecycle transition (harmless but loud). Apply order
# in `kubectl apply -k` mirrors the `resources:` list order, so
# sequencing the sink base first means the Service exists by the
# time the operator reconciles the feature-flags ConfigMap.
#
# servicemonitor-tekton-pipelines.yaml (issue #41) is in the same
# boat as tektonconfig-pruner.yaml: the ServiceMonitor CR is owned
# by the Prometheus Operator, which is part of OpenShift's built-in
# monitoring stack and is NOT present on the k3s/kind dev overlays —
# see the per-file comment for the full rationale.
resources:
  - ../../base/tekton-pipelines
  - ../../base/build-builder-image
  - ../../base/build-grype-db
  - ../../base/cloudevents-sink
  - tektonconfig-pruner.yaml
  - servicemonitor-tekton-pipelines.yaml

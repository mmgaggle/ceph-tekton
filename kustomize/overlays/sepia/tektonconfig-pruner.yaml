# TektonConfig — pruner configuration for Sepia.
#
# Closes mmgaggle/ceph-tekton#60.
#
# WHY THIS FILE NOW EXISTS
# ------------------------
# Before this commit, ceph-tekton did not manage a TektonConfig
# object at all. The dev overlays (dev-local, dev-kind) install
# Tekton Pipelines directly via `release.yaml` from the
# tekton-releases bucket — there is no tektoncd-operator in the
# loop, so there is no TektonConfig to patch.
#
# Sepia is different: Sepia is OpenShift, and OpenShift Pipelines
# ships the operator as the supported install path. The operator
# owns a singleton `TektonConfig` named `config` (cluster-scoped)
# that drives every Tekton component (pipelines, triggers, chains,
# pac) AND the pruner CronJob the operator creates for us.
#
# We are therefore taking ownership of the `config` TektonConfig
# starting with this manifest. Three operator-driven blocks live
# here today:
#   - spec.pruner.*   — issue #60: TaskRun/PipelineRun count-based
#                       retention.
#   - spec.pipeline.* — issue #63: CloudEvents emission to the
#                       in-cluster sink.
#   - spec.chain.*    — issue #27: SLSA v1.0 attestations, Fulcio
#                       keyless signing, public Rekor transparency.
#                       See the chain block below for the per-key
#                       rationale and the S3-sibling .intoto.jsonl
#                       design the publish-repo Task implements
#                       on top of the Statement Chains writes to
#                       the PipelineRun annotation.
#
# SCHEMA SOURCE
# -------------
# Field names below come from the upstream tektoncd/operator API
# (`TektonConfig.spec.pruner`) which is the same API the OpenShift
# Pipelines operator exposes. See:
#   - OpenShift Pipelines 1.12 docs (Automatic pruning of
#     TaskRun/PipelineRun) — linked in issue #60.
#   - Upstream operator API:
#     https://github.com/tektoncd/operator/blob/main/pkg/apis/operator/v1alpha1/tektonconfig_types.go
#
# Fields used:
#   spec.pruner.disabled  (bool)    — false enables the pruner.
#   spec.pruner.schedule  (cron)    — CronJob schedule.
#   spec.pruner.keep      (int)     — keep the N most-recent runs
#                                     per (namespace, pipeline/task
#                                     label). Count-based retention.
#   spec.pruner.resources ([]string)— which Tekton resources the
#                                     pruner sweeps. Allowed values
#                                     are "pipelinerun" and "taskrun"
#                                     in the upstream API.
#
# NOT used here (deliberate):
#   spec.pruner.keep-since (int, minutes) — time-based retention.
#     The upstream API only supports ONE retention dimension at a
#     time per TektonConfig (keep XOR keep-since), and it does not
#     differentiate by completion status (success vs failed). The
#     "7 days successful / 30 days failed" framing some readers
#     might expect is NOT expressible in this object — it would
#     require a custom CronJob or per-namespace pruner overrides
#     (spec.pruner.namespaces[]). Issue #60 is scoped to the
#     simple cluster-wide knob; per-Pipeline / per-status tuning
#     is the deliberately-deferred follow-up the issue calls out.
#
# RETENTION CHOICE
# ----------------
# `keep: 100` and `schedule: "0 */6 * * *"` come straight from
# issue #60's "What to build" block. Rationale: every 6 hours
# (4x the operator default of daily) keeps etcd object count
# bounded against the per-PR validation pipelines that produce
# the highest volume; keeping 100 per (namespace, pipeline label)
# preserves enough recent history for an operator to triage a
# regression without needing to fall back to Tekton Results
# (#59, deployed) for every recent run.
#
# Safe to land NOW because #59 (Tekton Results on Sepia) is
# closed — Results catches the archived PipelineRun/TaskRun data
# before this pruner deletes the live objects, so the historical
# context survives. Do not enable this on a cluster that does
# not have Results catching its data first.
apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  # The OpenShift Pipelines operator reconciles a singleton named
  # `config`; any other name is ignored. Cluster-scoped — no
  # namespace.
  name: config
spec:
  # `targetNamespace` is required by the operator. Sepia uses the
  # default OpenShift Pipelines install namespace.
  targetNamespace: openshift-pipelines
  pruner:
    disabled: false
    # Every 6h, not the operator default of once-daily. The Red
    # Hat "Operating Tekton at scale" post (linked in #60) calls
    # out daily as too slow for high-cadence PR validation
    # pipelines.
    schedule: "0 */6 * * *"
    # Count-based retention per (namespace, pipeline label).
    keep: 100
    resources:
      - pipelinerun
      - taskrun
  # ----------------------------------------------------------------
  # CloudEvents wiring for the build-archive sink (issue #63).
  #
  # The operator reconciles `spec.pipeline.*` into the Tekton
  # Pipelines `feature-flags` ConfigMap. Two flags together turn on
  # PipelineRun + TaskRun lifecycle CloudEvents and point the
  # controller at the in-cluster `cloudevents-sink` Service that
  # batches them to s3://ceph-tekton-events as JSON-Lines.
  #
  #   send-cloudevents-for-runs   `true` enables emission. Default
  #                               false; without this the controller
  #                               does not POST CloudEvents at all.
  #   default-cloud-events-sink   Absolute URL the controller POSTs
  #                               to. Must resolve from the
  #                               tekton-pipelines namespace; the
  #                               .svc.cluster.local FQDN is the
  #                               unambiguous absolute form (see
  #                               kustomize/base/cloudevents-sink/
  #                               service.yaml for why we use the
  #                               long-form host).
  #
  # ORDERING SAFETY
  # ---------------
  # Enabling send-cloudevents-for-runs on a cluster where the sink
  # Service does not resolve makes the controller log
  # `dial tcp: lookup cloudevents-sink.cloudevents-sink.svc.cluster.local:
  # no such host` once per PipelineRun lifecycle transition. Loud but
  # harmless — pipelines still run. The deploy order documented in
  # docs/build-archive.md §"Enabling Tekton CloudEvents" is:
  #   1. terraform apply the events bucket
  #   2. kubectl apply -k kustomize/base/cloudevents-sink/
  #      (the sepia overlay pulls this in via resources: below)
  #   3. land this TektonConfig change
  # Following that order avoids the noisy-log window entirely.
  #
  # SCOPE OF THIS WIRING
  # --------------------
  # Sepia only. The dev-{local,kind} overlays install raw Tekton
  # Pipelines via `release.yaml` (no operator in the loop), so this
  # TektonConfig has no effect there — the kind feature-flags
  # equivalent is the manual `kubectl patch configmap feature-flags`
  # call documented in docs/build-archive.md, and the e2e assertion
  # exercises the sink directly via curl rather than going through
  # the Tekton controller. That keeps the kind smoke fast and
  # independent of any operator-only API surface.
  #
  # SCHEMA REFERENCE
  # ----------------
  # OpenShift Pipelines TektonConfig.spec.pipeline pass-through for
  # the upstream Tekton Pipelines `feature-flags` ConfigMap keys:
  #   - https://tekton.dev/docs/pipelines/events/
  #   - https://tekton.dev/docs/pipelines/install/#customizing-the-pipelines-controller-behavior
  #   - https://github.com/tektoncd/operator/blob/main/pkg/apis/operator/v1alpha1/tektonconfig_types.go
  pipeline:
    # YAML string `"true"`, not boolean `true` — the upstream Tekton
    # feature-flags ConfigMap stores every value as a string and the
    # operator pass-through validates the shape against that schema.
    # A bare `true` here is rejected at admission with
    # `expected string, got bool`.
    send-cloudevents-for-runs: "true"
    # Absolute URL — Service `cloudevents-sink` in namespace
    # `cloudevents-sink` (kustomize/base/cloudevents-sink/). The
    # double-segment is intentional: first token is the Service
    # name, second is the Namespace. CoreDNS resolves the short
    # form from any namespace; the .svc.cluster.local suffix is the
    # unambiguous absolute form, so resolution can't be redirected
    # by tekton-pipelines's local search domain.
    default-cloud-events-sink: "http://cloudevents-sink.cloudevents-sink.svc.cluster.local"
  # ----------------------------------------------------------------
  # Tekton Chains config for Sepia (issue #27).
  #
  # On Sepia the OpenShift Pipelines operator owns Chains — it
  # installs the controller, the `chains-config` ConfigMap, and the
  # `signing-secrets` Secret in the `openshift-pipelines` namespace.
  # `TektonConfig.spec.chain.*` is the operator pass-through: every
  # entry below is reconciled verbatim into a key on the
  # `chains-config` ConfigMap. Same shape as `spec.pipeline.*`
  # above — the dev overlays don't run the operator, so they
  # install the standalone `kustomize/base/tekton-chains/` base
  # instead (see hack/dev-chains-setup.sh).
  #
  # Schema source: tektoncd/operator
  #   pkg/apis/operator/v1alpha1/tektonchain_types.go (`ChainProperties`)
  # which mirrors tektoncd/chains config/config.go field names. Every
  # value below maps to a documented Chains ConfigMap key (the same
  # ones the base patch in kustomize/base/tekton-chains/chains-config.patch.yaml
  # lists for the dev install).
  #
  # WHAT THIS WIRES UP
  # ------------------
  # 1. **SLSA Provenance v1.0** in-toto Statements for every
  #    PipelineRun and TaskRun, format `slsa/v2alpha4` (the only
  #    Chains 0.26.x format whose predicateType is
  #    `https://slsa.dev/provenance/v1`; see provenance.md
  #    §"Inspecting the attestation").
  # 2. **Fulcio keyless signing** via the cluster's SA-token OIDC
  #    issuer. The PipelineRun executor SA's projected token is
  #    exchanged at Fulcio for a short-lived X.509 cert bound to the
  #    SA identity — no long-lived signing keys touch the cluster.
  #    Identity binding: `system:serviceaccount:sepia-pipelines:ceph-pipeline-sa`
  #    (see docs/architecture.md §"Signing identity").
  # 3. **Public Rekor** transparency log entry per attestation. The
  #    downstream verifier (the package-attestation sibling story,
  #    #28) calls `cosign verify-blob-attestation` which gates on
  #    the Rekor entry being present AND the Fulcio cert chaining
  #    back to the Sigstore root.
  # 4. **Per-package S3-sibling attestations** are NOT a Chains
  #    backend in 0.26 — Chains exposes the signed Statement on the
  #    PipelineRun's `chains.tekton.dev/payload-pipelinerun-*`
  #    annotation, and the `publish-repo` Task (deferred, lands
  #    alongside the build-package pipeline in #16-adjacent work)
  #    reads that annotation and PUTs the in-toto Statement as
  #    `s3://<bucket>/<branch>/<sha>/<distro>/<arch>/attestations/<pkg>.intoto.jsonl`
  #    next to the .deb/.rpm artifact. That keeps Chains stateless
  #    and avoids depending on a Chains S3 backend (Chains 0.26 ships
  #    `gcs`-only for file storage; we explicitly do not use GCS —
  #    see docs/provenance.md §"Per-build package SBOMs" for the
  #    same convention applied to SBOMs). `artifacts.pipelinerun.enable-deep-inspection`
  #    below is what makes the PipelineRun attestation roll up every
  #    `IMAGES` / `SBOM_IMAGES` Result the child TaskRuns emit, so
  #    one annotation carries every per-package subject the
  #    publish-repo Task needs to split into per-`.intoto.jsonl`
  #    files.
  #
  # WHY NO `oci` STORAGE BACKEND HERE
  # ---------------------------------
  # `artifacts.oci.storage=oci` is the right knob for **image**
  # attestations (lands as a cosign referrer next to the image in
  # quay.io / the in-cluster registry). The image-build pipeline
  # that needs it (#26) is a separate slice; setting it here would
  # silently misfire on PipelineRuns that don't emit `IMAGE_*`
  # Results. Leave `artifacts.oci.*` defaulted (Chains will sign
  # any `IMAGE_*` it sees, storing to the controller's default OCI
  # behavior) and let #26 turn the explicit knob on when the image
  # pipeline lands.
  #
  # ORDERING SAFETY
  # ---------------
  # Same shape as the cloudevents pass-through above. The operator
  # reconciles this block on every change; the controller picks up
  # the new ConfigMap values without a restart. If the `signing-secrets`
  # Secret doesn't exist yet, Chains logs "no signing key found" once
  # per attestation attempt — loud but harmless, and the secret is
  # provisioned by a separate Sepia bootstrap step (operator-managed
  # `TektonChain` CR; see PLAN.md §"Bootstrap & cluster install").
  chain:
    # ---- attestation format ----
    # slsa/v2alpha4 emits the in-toto predicateType
    # `https://slsa.dev/provenance/v1` (SLSA v1.0). See
    # docs/provenance.md §"Inspecting the attestation" and
    # tektoncd/chains v0.26 docs/slsa-provenance.md for the predicate
    # shape. Same value as kustomize/base/tekton-chains/chains-config.patch.yaml
    # so dev and Sepia produce attestations a single verifier accepts.
    artifacts.taskrun.format: "slsa/v2alpha4"
    artifacts.pipelinerun.format: "slsa/v2alpha4"
    # ---- attestation storage ----
    # `tekton` = attach the signed Statement to the run as a
    # `chains.tekton.dev/payload-*` annotation. The publish-repo
    # Task reads the annotation and writes the
    # <package>.intoto.jsonl sibling object to S3 (see top-of-block
    # comment for the S3 layout). `s3` is not a supported backend
    # in Chains 0.26; `gcs` is, but we explicitly do not use GCS.
    artifacts.taskrun.storage: "tekton"
    artifacts.pipelinerun.storage: "tekton"
    # Roll up every child TaskRun's type-hinted Results (IMAGES,
    # SBOM_IMAGES, *_ARTIFACT_OUTPUTS, …) into the PipelineRun-level
    # attestation. Without this, the per-package subjects emitted
    # by build-package's child TaskRuns would not appear in the
    # PipelineRun attestation the publish-repo Task is going to
    # split into sibling .intoto.jsonl files. Required key for the
    # #27 design. Upstream: tektoncd/chains config/config.go.
    artifacts.pipelinerun.enable-deep-inspection: "true"
    # ---- signing ----
    # Fulcio keyless. The Chains controller exchanges the executor
    # SA's projected token at Fulcio's public-good instance for a
    # short-lived X.509 cert bound to the SA identity, then signs
    # the in-toto Statement with the cert's private key. No
    # long-lived signing key in the cluster. Verifier flow lives in
    # docs/provenance.md §"Promoting to Fulcio keyless (Sepia)" and
    # is exercised by issue #28.
    signers.x509.fulcio.enabled: "true"
    signers.x509.fulcio.address: "https://fulcio.sigstore.dev"
    # `kubernetes` provider tells Chains to use the in-cluster SA
    # token via the projected-volume convention. The alternative
    # (`spiffe`) is for SPIRE-issued SVIDs; Sepia doesn't run SPIRE
    # so `kubernetes` is the right choice.
    signers.x509.fulcio.provider: "kubernetes"
    # OIDC issuer = the Sepia OpenShift cluster's SA token issuer
    # URL — Fulcio fetches the issuer's discovery doc to verify the
    # SA token. The actual URL is a per-cluster value set during
    # Sepia bootstrap (kube-apiserver `--service-account-issuer`
    # flag); leaving it unset here lets Fulcio fall back to the
    # token's `iss` claim, which is what we want. If a future
    # Sepia overlay needs to pin the issuer (e.g. for an air-gapped
    # Fulcio), add `signers.x509.fulcio.issuer: "<url>"` here.
    # ---- transparency ----
    # Sign-and-log every attestation to the public-good Rekor. The
    # #28 verification side (`cosign verify-blob-attestation`)
    # depends on the Rekor entry being present, so leaving this
    # enabled now means #28 can land independently without a
    # second Chains-config change. Same Rekor URL as dev — one
    # public log holds entries from both environments and the
    # verifier doesn't need to know which cluster produced an entry.
    transparency.enabled: "true"
    transparency.url: "https://rekor.sigstore.dev"

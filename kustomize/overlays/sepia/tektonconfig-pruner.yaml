# TektonConfig — pruner configuration for Sepia.
#
# Closes mmgaggle/ceph-tekton#60.
#
# WHY THIS FILE NOW EXISTS
# ------------------------
# Before this commit, ceph-tekton did not manage a TektonConfig
# object at all. The dev overlays (dev-local, dev-kind) install
# Tekton Pipelines directly via `release.yaml` from the
# tekton-releases bucket — there is no tektoncd-operator in the
# loop, so there is no TektonConfig to patch.
#
# Sepia is different: Sepia is OpenShift, and OpenShift Pipelines
# ships the operator as the supported install path. The operator
# owns a singleton `TektonConfig` named `config` (cluster-scoped)
# that drives every Tekton component (pipelines, triggers, chains,
# pac) AND the pruner CronJob the operator creates for us.
#
# We are therefore taking ownership of the `config` TektonConfig
# starting with this manifest. Today it only carries the pruner
# block (the focused scope of issue #60). Future PRs will move
# the chains-config overrides and any other operator-driven
# settings into this same object — see the comment in
# kustomize/overlays/sepia/kustomization.yaml about where
# follow-up patches land.
#
# SCHEMA SOURCE
# -------------
# Field names below come from the upstream tektoncd/operator API
# (`TektonConfig.spec.pruner`) which is the same API the OpenShift
# Pipelines operator exposes. See:
#   - OpenShift Pipelines 1.12 docs (Automatic pruning of
#     TaskRun/PipelineRun) — linked in issue #60.
#   - Upstream operator API:
#     https://github.com/tektoncd/operator/blob/main/pkg/apis/operator/v1alpha1/tektonconfig_types.go
#
# Fields used:
#   spec.pruner.disabled  (bool)    — false enables the pruner.
#   spec.pruner.schedule  (cron)    — CronJob schedule.
#   spec.pruner.keep      (int)     — keep the N most-recent runs
#                                     per (namespace, pipeline/task
#                                     label). Count-based retention.
#   spec.pruner.resources ([]string)— which Tekton resources the
#                                     pruner sweeps. Allowed values
#                                     are "pipelinerun" and "taskrun"
#                                     in the upstream API.
#
# NOT used here (deliberate):
#   spec.pruner.keep-since (int, minutes) — time-based retention.
#     The upstream API only supports ONE retention dimension at a
#     time per TektonConfig (keep XOR keep-since), and it does not
#     differentiate by completion status (success vs failed). The
#     "7 days successful / 30 days failed" framing some readers
#     might expect is NOT expressible in this object — it would
#     require a custom CronJob or per-namespace pruner overrides
#     (spec.pruner.namespaces[]). Issue #60 is scoped to the
#     simple cluster-wide knob; per-Pipeline / per-status tuning
#     is the deliberately-deferred follow-up the issue calls out.
#
# RETENTION CHOICE
# ----------------
# `keep: 100` and `schedule: "0 */6 * * *"` come straight from
# issue #60's "What to build" block. Rationale: every 6 hours
# (4x the operator default of daily) keeps etcd object count
# bounded against the per-PR validation pipelines that produce
# the highest volume; keeping 100 per (namespace, pipeline label)
# preserves enough recent history for an operator to triage a
# regression without needing to fall back to Tekton Results
# (#59, deployed) for every recent run.
#
# Safe to land NOW because #59 (Tekton Results on Sepia) is
# closed — Results catches the archived PipelineRun/TaskRun data
# before this pruner deletes the live objects, so the historical
# context survives. Do not enable this on a cluster that does
# not have Results catching its data first.
apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  # The OpenShift Pipelines operator reconciles a singleton named
  # `config`; any other name is ignored. Cluster-scoped — no
  # namespace.
  name: config
spec:
  # `targetNamespace` is required by the operator. Sepia uses the
  # default OpenShift Pipelines install namespace.
  targetNamespace: openshift-pipelines
  pruner:
    disabled: false
    # Every 6h, not the operator default of once-daily. The Red
    # Hat "Operating Tekton at scale" post (linked in #60) calls
    # out daily as too slow for high-cadence PR validation
    # pipelines.
    schedule: "0 */6 * * *"
    # Count-based retention per (namespace, pipeline label).
    keep: 100
    resources:
      - pipelinerun
      - taskrun
  # ----------------------------------------------------------------
  # CloudEvents wiring for the build-archive sink (issue #63).
  #
  # The operator reconciles `spec.pipeline.*` into the Tekton
  # Pipelines `feature-flags` ConfigMap. Two flags together turn on
  # PipelineRun + TaskRun lifecycle CloudEvents and point the
  # controller at the in-cluster `cloudevents-sink` Service that
  # batches them to s3://ceph-tekton-events as JSON-Lines.
  #
  #   send-cloudevents-for-runs   `true` enables emission. Default
  #                               false; without this the controller
  #                               does not POST CloudEvents at all.
  #   default-cloud-events-sink   Absolute URL the controller POSTs
  #                               to. Must resolve from the
  #                               tekton-pipelines namespace; the
  #                               .svc.cluster.local FQDN is the
  #                               unambiguous absolute form (see
  #                               kustomize/base/cloudevents-sink/
  #                               service.yaml for why we use the
  #                               long-form host).
  #
  # ORDERING SAFETY
  # ---------------
  # Enabling send-cloudevents-for-runs on a cluster where the sink
  # Service does not resolve makes the controller log
  # `dial tcp: lookup cloudevents-sink.cloudevents-sink.svc.cluster.local:
  # no such host` once per PipelineRun lifecycle transition. Loud but
  # harmless — pipelines still run. The deploy order documented in
  # docs/build-archive.md §"Enabling Tekton CloudEvents" is:
  #   1. terraform apply the events bucket
  #   2. kubectl apply -k kustomize/base/cloudevents-sink/
  #      (the sepia overlay pulls this in via resources: below)
  #   3. land this TektonConfig change
  # Following that order avoids the noisy-log window entirely.
  #
  # SCOPE OF THIS WIRING
  # --------------------
  # Sepia only. The dev-{local,kind} overlays install raw Tekton
  # Pipelines via `release.yaml` (no operator in the loop), so this
  # TektonConfig has no effect there — the kind feature-flags
  # equivalent is the manual `kubectl patch configmap feature-flags`
  # call documented in docs/build-archive.md, and the e2e assertion
  # exercises the sink directly via curl rather than going through
  # the Tekton controller. That keeps the kind smoke fast and
  # independent of any operator-only API surface.
  #
  # SCHEMA REFERENCE
  # ----------------
  # OpenShift Pipelines TektonConfig.spec.pipeline pass-through for
  # the upstream Tekton Pipelines `feature-flags` ConfigMap keys:
  #   - https://tekton.dev/docs/pipelines/events/
  #   - https://tekton.dev/docs/pipelines/install/#customizing-the-pipelines-controller-behavior
  #   - https://github.com/tektoncd/operator/blob/main/pkg/apis/operator/v1alpha1/tektonconfig_types.go
  pipeline:
    # YAML string `"true"`, not boolean `true` — the upstream Tekton
    # feature-flags ConfigMap stores every value as a string and the
    # operator pass-through validates the shape against that schema.
    # A bare `true` here is rejected at admission with
    # `expected string, got bool`.
    send-cloudevents-for-runs: "true"
    # Absolute URL — Service `cloudevents-sink` in namespace
    # `cloudevents-sink` (kustomize/base/cloudevents-sink/). The
    # double-segment is intentional: first token is the Service
    # name, second is the Namespace. CoreDNS resolves the short
    # form from any namespace; the .svc.cluster.local suffix is the
    # unambiguous absolute form, so resolution can't be redirected
    # by tekton-pipelines's local search domain.
    default-cloud-events-sink: "http://cloudevents-sink.cloudevents-sink.svc.cluster.local"
